<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | PrimeMobile</title>
    <link rel="icon" href="/images/PrimeMobile_logo.png">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --pm-primary:      #1565C0;
            --pm-primary-dark: #0D47A1;
            --pm-accent:       #FF6F00;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0D47A1 0%, #1976D2 50%, #283593 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 2rem 0;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 24px 64px rgba(0,0,0,.25);
            padding: 2.5rem 2.5rem;
            width: 100%;
            max-width: 480px;
        }
        .login-logo {
            width: 60px; height: 60px; border-radius: 16px;
            background: linear-gradient(135deg, var(--pm-primary), var(--pm-primary-dark));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; margin: 0 auto 1rem;
            box-shadow: 0 8px 24px rgba(21,101,192,.35);
        }
        .form-control {
            border-radius: 10px; padding: .65rem 1rem;
            border: 1.5px solid #E0E7FF;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus {
            border-color: var(--pm-primary);
            box-shadow: 0 0 0 3px rgba(21,101,192,.15);
        }
        .input-group-text {
            border-radius: 10px 0 0 10px !important;
            border: 1.5px solid #E0E7FF; border-right: none;
            background: #F8FAFF; color: #9CA3AF;
        }
        .input-group .form-control { border-radius: 0 10px 10px 0 !important; border-left: none; }
        .input-group:focus-within .input-group-text { border-color: var(--pm-primary); }
        .btn-login {
            background: linear-gradient(135deg, var(--pm-primary), var(--pm-primary-dark));
            border: none; border-radius: 10px; color: #fff;
            font-weight: 700; font-size: 1rem; padding: .7rem;
            width: 100%; transition: all .2s;
            box-shadow: 0 4px 16px rgba(21,101,192,.35);
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(21,101,192,.45); color: #fff; }
        .btn-login:active { transform: translateY(0); }
        .alert-danger { border-radius: 10px; border: none; background: #FFF0F0; color: #C0392B; }
        .divider { height: 1px; background: #E0E7FF; margin: 1.25rem 0; }
        .show-pw-btn { cursor: pointer; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #9CA3AF; background: none; border: none; padding: 0; z-index: 5; }
    </style>
</head>
<body>

<div class="login-card">

    <!-- Logo & Tiêu đề -->
    <div class="text-center mb-4">
        <div class="login-logo">
            <!-- Dùng icon text tạm thời hoặc thay bằng đường dẫn logo gốc -->
            <img src="/images/PrimeMobile_logo.png" alt="Logo" style="width:100%; height:100%; object-fit:cover; border-radius:16px;" onerror="this.outerHTML='📱'">
        </div>
        <h1 class="fw-bold mb-1" style="font-size:1.5rem; color:#1A1A2E;">Đăng ký tài khoản</h1>
        <p class="text-muted small mb-0">Trở thành thành viên của PrimeMobile</p>
    </div>

    <!-- Alert lỗi (chỉ hiện khi có ?error=true) -->
    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2 mb-3 py-2" role="alert">
        <i class="fa fa-exclamation-circle"></i>
        <span th:text="${errorMessage}">Lỗi đăng ký</span>
    </div>

    <!-- Form đăng ký -->
    <form action="/dang-ky" method="post" id="registerForm" novalidate>

        <!-- Họ tên -->
        <div class="mb-3">
            <label for="hoTen" class="form-label fw-semibold small text-muted">Họ và tên</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa fa-user fa-sm"></i></span>
                <input type="text" class="form-control" id="hoTen" name="hoTen"
                       placeholder="Nhập họ và tên..." required autofocus>
            </div>
        </div>

        <!-- Số điện thoại -->
        <div class="mb-3">
            <label for="soDienThoai" class="form-label fw-semibold small text-muted">Số điện thoại</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa fa-phone fa-sm"></i></span>
                <input type="tel" class="form-control" id="soDienThoai" name="soDienThoai"
                       placeholder="Nhập số điện thoại..." required>
            </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold small text-muted">Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa fa-envelope fa-sm"></i></span>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Nhập địa chỉ email..."
                       autocomplete="email" required>
            </div>
        </div>

        <!-- Mật khẩu -->
        <div class="mb-4">
            <label for="matKhau" class="form-label fw-semibold small text-muted">Mật khẩu</label>
            <div class="input-group position-relative">
                <span class="input-group-text"><i class="fa fa-lock fa-sm"></i></span>
                <input type="password" class="form-control pe-5" id="matKhau" name="matKhau"
                       placeholder="••••••••" autocomplete="new-password" required>
                <button type="button" class="show-pw-btn" id="togglePw" title="Hiện/ẩn mật khẩu">
                    <i class="fa fa-eye-slash fa-sm" id="pwIcon"></i>
                </button>
            </div>
            <div class="form-text small text-muted mt-1">Mật khẩu nên chứa ít nhất 6 ký tự.</div>
        </div>

        <!-- Nút đăng ký -->
        <button type="submit" class="btn btn-login" id="btnRegister">
            <i class="fa fa-user-plus me-2"></i>Đăng ký
        </button>

    </form>

    <div class="divider"></div>

    <!-- Footer -->
    <div class="text-center mt-3">
        <p class="text-muted mb-2" style="font-size:.9rem;">
            Đã có tài khoản? <a href="/dang-nhap" class="fw-bold text-decoration-none" style="color: var(--pm-primary);">Đăng nhập</a>
        </p>
        <p class="text-muted mb-0" style="font-size:.85rem;">
            <a href="/" class="text-decoration-none text-muted">
                <i class="fa fa-arrow-left me-1"></i>Trở về trang chủ (Khách vãng lai)
            </a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Toggle hiện/ẩn mật khẩu
    const toggleBtn = document.getElementById('togglePw');
    const pwInput   = document.getElementById('matKhau');
    const pwIcon    = document.getElementById('pwIcon');
    if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
            const isHidden = pwInput.type === 'password';
            pwInput.type = isHidden ? 'text' : 'password';
            pwIcon.className = isHidden ? 'fa fa-eye fa-sm' : 'fa fa-eye-slash fa-sm';
        });
    }

    // Loading state khi submit
    document.getElementById('registerForm')?.addEventListener('submit', function () {
        const btn = document.getElementById('btnRegister');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';
        btn.disabled = true;
    });
</script>
</body>
</html>
