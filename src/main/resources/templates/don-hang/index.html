<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PrimeMobile'">Đơn hàng của tôi | PrimeMobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --pm-primary:#0d9488;
            --pm-primary-dark:#115e59;
            --pm-bg:#f8fafc;
            --pm-text:#0f172a;
            --pm-muted:#64748b;
            --pm-line:#e2e8f0;
        }
        body { font-family:'Inter',sans-serif; background:var(--pm-bg); color:var(--pm-text); min-height:100vh; }
        .pm-page { padding:32px 0 56px; }
        .pm-toolbar { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:18px; }
        .pm-panel { background:#fff; border:1px solid var(--pm-line); border-radius:8px; box-shadow:0 10px 28px rgba(15,23,42,.06); }
        .pm-order { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; padding:18px 20px; border-bottom:1px solid var(--pm-line); }
        .pm-order:last-child { border-bottom:0; }
        .pm-meta { color:var(--pm-muted); font-size:.92rem; }
        .pm-total { color:#ea580c; font-size:1.2rem; font-weight:900; white-space:nowrap; }
        .pm-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
        .btn-pm { background:var(--pm-primary); color:#fff; border:0; border-radius:8px; font-weight:800; }
        .btn-pm:hover { background:var(--pm-primary-dark); color:#fff; }
        .pm-empty { padding:48px 20px; text-align:center; color:var(--pm-muted); }
        .pm-detail-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:12px 0; border-bottom:1px solid var(--pm-line); }
        .pm-detail-row:last-child { border-bottom:0; }
        .status-cho_xac_nhan { background:#fff7ed; color:#c2410c; }
        .status-da_xac_nhan { background:#eff6ff; color:#1d4ed8; }
        .status-dang_giao { background:#ecfeff; color:#0e7490; }
        .status-da_hoan_thanh { background:#ecfdf5; color:#047857; }
        .status-da_huy { background:#f1f5f9; color:#475569; }
        .status-giao_that_bai { background:#fef2f2; color:#dc2626; border: 1px solid #fecaca; }
        .status-cho_hoan_tien { background:#fff7ed; color:#c2410c; border: 1px solid #fed7aa; }
        
        /* Tabs */
        .status-tabs { display:flex; gap:0; overflow-x:auto; border-bottom:1px solid var(--pm-line); margin-bottom: 24px; padding-bottom: 0; }
        .status-tabs::-webkit-scrollbar { height: 4px; }
        .status-tabs::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .tab-btn { background:none; border:none; border-bottom: 3px solid transparent; padding: 12px 16px; font-weight: 600; color: var(--pm-muted); cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .tab-btn:hover { color: var(--pm-text); }
        .tab-btn.active { color: #dc2626; border-bottom-color: #dc2626; }
        .tab-btn span { display: inline-block; background: #e2e8f0; color: #475569; border-radius: 12px; padding: 2px 8px; font-size: 0.75rem; margin-left: 6px; }
        .tab-btn.active span { background: #fee2e2; color: #dc2626; }

        /* Stepper */
        .order-stepper { display: flex; justify-content: space-between; align-items: center; position: relative; margin: 10px 0 40px; padding: 0 30px; }
        .step-line-track { position: absolute; top: 15px; left: 60px; right: 60px; height: 3px; background: #e2e8f0; z-index: 0; }
        .step-line-fill { height: 100%; background: #10b981; transition: 0.3s; }
        .step-line-fill.failed-line { background: #ef4444; }
        .step { position: relative; z-index: 1; text-align: center; width: 60px; }
        .step-icon { width: 34px; height: 34px; background: #fff; border: 3px solid #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; color: #94a3b8; background-color: #f8fafc; font-size: 0.9rem; transition: 0.3s; }
        .step-label { font-size: 0.75rem; font-weight: 600; color: #64748b; white-space: nowrap; position: absolute; left: 50%; transform: translateX(-50%); }
        .step.completed .step-icon { background-color: #10b981; border-color: #10b981; color: #fff; }
        .step.completed .step-label { color: #10b981; }
        .step.active .step-icon { border-color: #10b981; color: #10b981; box-shadow: 0 0 0 4px #d1fae5; background-color: #fff; }
        .step.active .step-label { color: #10b981; }
        .step.failed .step-icon { background-color: #ef4444; border-color: #ef4444; color: #fff; }
        .step.failed .step-label { color: #ef4444; }
        
        @media (max-width: 768px) {
            .pm-toolbar { align-items:flex-start; flex-direction:column; }
            .pm-order { grid-template-columns:1fr; }
            .pm-actions { justify-content:flex-start; }
            .pm-total { white-space:normal; }
        }
        .pm-product-link { color: inherit; text-decoration: none; }
        .pm-product-link:hover { text-decoration: underline; color: inherit; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="pm-page">
    <div class="container">
        <div class="pm-toolbar">
            <div>
                <h1 class="h3 mb-1" style="font-weight:900;">Đơn hàng của tôi</h1>
                <div class="text-muted">Theo dõi trạng thái và xem lại các sản phẩm đã đặt</div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-outline-secondary" id="open-chatbot-btn">
                    <i class="fa fa-comments me-1"></i> Chat với AI
                </button>
                <a href="/san-pham" class="btn btn-outline-secondary">
                    <i class="fa fa-arrow-left me-1"></i> Tiếp tục mua
                </a>
            </div>
        </div>

        <div class="alert alert-danger d-none" id="order-error"></div>
        
        <div class="status-tabs" id="status-tabs">
            <button class="tab-btn active" data-status="all">Tất cả <span id="count-all">0</span></button>
            <button class="tab-btn" data-status="cho_xac_nhan">Chờ xác nhận <span id="count-cho_xac_nhan">0</span></button>
            <button class="tab-btn" data-status="da_xac_nhan">Đã xác nhận <span id="count-da_xac_nhan">0</span></button>
            <button class="tab-btn" data-status="dang_giao">Đang vận chuyển <span id="count-dang_giao">0</span></button>
            <button class="tab-btn" data-status="da_hoan_thanh">Đã nhận hàng <span id="count-da_hoan_thanh">0</span></button>
            <button class="tab-btn" data-status="da_huy">Đã hủy <span id="count-da_huy">0</span></button>
        </div>

        <section id="orders-panel">
            <div class="pm-panel p-4 text-center text-muted" id="orders-loading">
                <i class="fa fa-spinner fa-spin me-1"></i>Đang tải đơn hàng
            </div>
            <div id="orders-list"></div>
            <div class="pm-panel pm-empty d-none" id="orders-empty">
                <i class="fa fa-receipt fa-2x mb-3"></i>
                <div class="fw-bold mb-1">Bạn chưa có đơn hàng nào</div>
                <a href="/san-pham" class="btn btn-pm mt-3">Mua sắm ngay</a>
            </div>
        </section>
    </div>
</main>

<div class="modal fade" id="orderDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content" style="border-radius:8px;">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title h5 fw-bold" id="detail-title">Chi tiết đơn hàng</h2>
                    <div class="small text-muted" id="detail-date"></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger d-none" id="detail-error"></div>
                <div id="detail-content">
                    <div class="text-center text-muted py-4">
                        <i class="fa fa-spinner fa-spin me-1"></i>Đang tải chi tiết
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
            </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const els = {
        loading: document.getElementById('orders-loading'),
        list: document.getElementById('orders-list'),
        empty: document.getElementById('orders-empty'),
        error: document.getElementById('order-error'),
        detailTitle: document.getElementById('detail-title'),
        detailDate: document.getElementById('detail-date'),
        detailContent: document.getElementById('detail-content'),
        detailError: document.getElementById('detail-error')
    };
    const detailModal = new bootstrap.Modal(document.getElementById('orderDetailModal'));

    function money(value) {
        return Number(value || 0).toLocaleString('vi-VN') + 'đ';
    }

    function dateTime(value) {
        if (!value) return '';
        return new Date(value).toLocaleString('vi-VN');
    }

    function date(value) {
        if (!value) return '';
        return new Date(value).toLocaleDateString('vi-VN', {day: '2-digit', month: '2-digit', year: 'numeric'});
    }

    function formatDateTime(value) {
        if (!value) return '';
        const d = new Date(value);
        const pad = n => n.toString().padStart(2, '0');
        return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
        })[ch]);
    }

    async function fetchJson(url, options = {}) {
        const response = await fetch(url, { credentials:'include', ...options });
        const text = await response.text();
        if (response.status === 401) {
            window.location.href = '/dang-nhap';
            return null;
        }
        if (!response.ok) {
            let message = text || 'Không thể xử lý yêu cầu.';
            try {
                const error = JSON.parse(text);
                message = error.message || message;
            } catch {
                // Keep plain text when the server does not return JSON.
            }
            throw new Error(message);
        }
        return text ? JSON.parse(text) : null;
    }

    function renderOrders(orders) {
        els.loading.classList.add('d-none');
        if (!orders.length) {
            els.empty.classList.remove('d-none');
            els.list.innerHTML = '';
            return;
        }
        els.empty.classList.add('d-none');
        els.list.innerHTML = orders.map(order => `
            <article class="pm-panel mb-3 shadow-sm border" data-order-id="${order.id}">
                <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom flex-wrap gap-2 bg-light rounded-top">
                    <div class="text-muted small">
                        Đơn hàng: <strong class="text-dark">#${esc(order.maDonHang)}</strong> 
                        <span class="mx-2">•</span> 
                        Ngày đặt hàng: <strong class="text-dark">${date(order.ngayDat)}</strong>
                        ${order.trangThai === 'da_hoan_thanh' && order.ngayGiaoThucTe ? `
                        <span class="mx-2">•</span> 
                        Ngày giao thực tế: <strong class="text-dark">${formatDateTime(order.ngayGiaoThucTe)}</strong>
                        ` : ''}
                    </div>
                    <div class="text-end">
                        <span class="badge text-bg-light border me-1">${esc(order.trangThaiThanhToanText)}</span>
                        <span class="badge status-${esc(order.trangThai)}">${esc(order.trangThaiText)}</span>
                    </div>
                </div>
                
                <div class="px-3 pt-2 pb-1">
                    ${(order.chiTiet || []).map(item => `
                        <div class="d-flex align-items-center gap-3 py-2" style="${(order.chiTiet || []).indexOf(item) !== 0 ? 'border-top: 1px solid #f1f5f9;' : ''}">
                            ${item.anhChinh ? `<img src="${item.anhChinh}" alt="${esc(item.tenSanPham)}" style="width:60px; height:60px; object-fit:cover; border-radius:4px; border:1px solid #eee;">` : `<div style="width:60px; height:60px; background:#f1f5f9; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#94a3b8;"><i class="fa fa-image fa-lg"></i></div>`}
                            <div class="flex-grow-1">
                                <a href="/san-pham/${item.sanPhamId}" class="pm-product-link fw-bold text-dark text-uppercase" style="font-size: 0.95rem;">${esc(item.tenSanPham)}</a>
                                <div class="fw-bold text-dark mt-1">${money(item.donGiaBan)} <span class="fw-normal text-muted ms-2">x${item.soLuong}</span></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                
                <div class="px-3 pb-3 pt-1 d-flex flex-column align-items-end gap-2 bg-white rounded-bottom">
                    <div>
                        <span class="text-muted me-2 small">Tổng thanh toán:</span>
                        <span class="pm-total text-danger fs-5">${money(order.tongThanhToan)}</span>
                    </div>
                    <div class="pm-actions d-flex gap-2 justify-content-end w-100 flex-wrap mt-1">
                        ${order.coTheHuy ? `
                            <button class="btn btn-sm btn-outline-danger px-3 fw-semibold" type="button" data-action="cancel" data-id="${order.id}">
                                Hủy đơn
                            </button>
                        ` : ''}
                        ${order.trangThai === 'cho_xac_nhan' && (order.trangThaiThanhToan === 'dang_chuyen_huong' || order.trangThaiThanhToan === 'that_bai') ? `
                            <button class="btn btn-sm btn-outline-warning px-3 fw-semibold" type="button" data-action="switch-cod" data-id="${order.id}">
                                Đổi sang COD
                            </button>
                            <button class="btn btn-sm btn-outline-primary px-3 fw-semibold" type="button" data-action="retry-vnpay" data-id="${order.id}">
                                Thanh toán lại
                            </button>
                        ` : ''}
                        <button class="btn btn-sm border-0 text-dark fw-semibold px-2 d-flex align-items-center" type="button" data-action="detail" data-id="${order.id}">
                            Xem chi tiết <i class="fa fa-chevron-right ms-1" style="font-size: 0.75rem;"></i>
                        </button>
                    </div>
                </div>
            </article>
        `).join('');
    }

    function renderDetail(order) {
        const items = order.chiTiet || [];
        els.detailTitle.textContent = `Chi tiết ${order.maDonHang}`;
        els.detailDate.textContent = dateTime(order.ngayDat);
        els.detailError.classList.add('d-none');
        
        let kenhBanText = order.kenhBan === 'online' ? 'Mua Online' : 'Mua Tại Quầy';
        let nhanVien = order.nhanVienXuLy || 'Hệ thống';
        
        els.detailContent.innerHTML = `
            ${renderStepper(order)}
            
            <div class="row g-4 mb-4 mt-3">
                <div class="col-md-6">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h6 class="card-title fw-bold text-uppercase text-muted mb-3"><i class="fa fa-user me-2"></i>Thông tin khách hàng</h6>
                            <div class="mb-2"><strong>Tên:</strong> ${esc(order.nguoiNhan || '')}</div>
                            <div class="mb-2"><strong>SĐT:</strong> ${esc(order.soDienThoaiNhan || '')}</div>
                            <div class="mb-2"><strong>Email:</strong> ${esc(order.emailNhan || '')}</div>
                            <div><strong>Địa chỉ:</strong> ${esc(order.diaChiNhan || '')}</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <h6 class="card-title fw-bold text-uppercase text-muted mb-3"><i class="fa fa-receipt me-2"></i>Thông tin đơn hàng</h6>
                            <div class="mb-2"><strong>Mã đơn:</strong> ${esc(order.maDonHang)}</div>
                            <div class="mb-2"><strong>Loại đơn:</strong> <span class="badge bg-secondary">${esc(kenhBanText)}</span></div>
                            <div class="mb-2"><strong>Nhân viên tiếp nhận:</strong> ${esc(nhanVien)}</div>
                            <div class="mb-2">
                                <strong>Trạng thái:</strong> 
                                <span class="badge status-${esc(order.trangThai)}">${esc(order.trangThaiText)}</span>
                            </div>
                            <div>
                                <strong>Thanh toán:</strong> 
                                <span class="badge text-bg-light border">${esc(order.trangThaiThanhToanText)}</span>
                            </div>
                            <div class="mb-2 mt-2">
                                <strong>Phương thức:</strong> ${(order.phuongThucThanhToan === 'Tien mat' && order.trangThaiThanhToan === 'chua_thanh_toan') ? '-' : esc(order.phuongThucThanhToan || '—')}
                            </div>
                            ${order.trangThai === 'da_hoan_thanh' && order.ngayGiaoThucTe ? `
                            <div class="mb-2">
                                <strong>Ngày giao thực tế:</strong> ${formatDateTime(order.ngayGiaoThucTe)}
                            </div>
                            ` : ''}
                            ${order.tenKhuyenMai ? `
                            <div>
                                <strong>Khuyến mãi:</strong>
                                <span class="badge bg-success-subtle text-success border border-success-subtle ms-1">
                                    <i class="fa fa-tag me-1"></i>${esc(order.tenKhuyenMai)} (-${money(order.tienGiamGia)})
                                </span>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            </div>
            
            <h6 class="fw-bold text-uppercase text-muted mb-3"><i class="fa fa-box-open me-2"></i>Danh sách sản phẩm</h6>
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-0">
                    ${items.map(item => `
                        <div class="pm-detail-row px-3 py-3 ${items.indexOf(item) !== items.length - 1 ? 'border-bottom' : ''}">
                            <div>
                                <a href="/san-pham/${item.sanPhamId}" class="pm-product-link fw-bold fs-6 mb-1 d-block">${esc(item.tenSanPham)}</a>
                                <div class="small text-muted mb-2">Phân loại: ${esc(item.mauSac)} - ${item.ramGb || 0}GB/${item.luuTruGb || 0}GB | SL: <strong>${item.soLuong}</strong></div>
                                ${item.imeiList && item.imeiList.length > 0 ? `
                                    <div class="small bg-light p-2 rounded">
                                        <strong>IMEI:</strong> ${item.imeiList.map(i => `<span class="badge bg-white text-dark border me-1">${esc(i)}</span>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                            <div class="text-end">
                                ${item.giaGoc && item.giaGoc > item.donGiaBan ? `
                                    <div class="text-muted small text-decoration-line-through">${money(item.giaGoc)}</div>
                                ` : ''}
                                <div class="fw-bold text-danger">${money(item.donGiaBan)}</div>
                                <div class="small text-muted mt-1">Tổng: ${money(item.thanhTien)}</div>
                            </div>
                        </div>
                    `).join('') || '<div class="p-3 text-muted">Không có sản phẩm.</div>'}
                </div>
            </div>
            
            <div class="card border-0 shadow-sm">
                <div class="card-body bg-light rounded">
                    <div class="d-flex justify-content-between mb-2"><span class="text-muted">Tổng tiền chưa giảm</span><strong>${money(order.tongTienHang)}</strong></div>
                    <div class="d-flex justify-content-between mb-2"><span class="text-muted">Tiền giảm giá</span><strong class="text-success">-${money(order.tienGiamGia)}</strong></div>
                    <div class="d-flex justify-content-between mb-2"><span class="text-muted">Phí vận chuyển</span><strong>${order.phiShip == 0 ? '<span class="text-success">Miễn phí</span>' : money(order.phiShip)}</strong></div>
                    <hr class="my-2">
                    <div class="d-flex justify-content-between align-items-end mt-2">
                        <span class="fw-bold">Thành tiền (sau giảm)</span>
                        <span class="pm-total fs-4 text-danger">${money(order.tongThanhToan)}</span>
                    </div>
                </div>
            </div>
            ${order.ghiChu ? `<div class="alert alert-warning border mt-3 mb-0"><i class="fa fa-info-circle me-2"></i><strong>Ghi chú:</strong> ${esc(order.ghiChu)}</div>` : ''}
        `;
    }

    let allOrders = [];
    let currentTab = 'all';

    function updateTabCounts() {
        const counts = { all: allOrders.length, cho_xac_nhan: 0, da_xac_nhan: 0, dang_giao: 0, da_hoan_thanh: 0, da_huy: 0 };
        allOrders.forEach(o => {
            if (counts[o.trangThai] !== undefined) counts[o.trangThai]++;
        });
        Object.keys(counts).forEach(k => {
            const el = document.getElementById(`count-${k}`);
            if (el) el.textContent = counts[k];
        });
    }

    function filterAndRenderOrders() {
        const filtered = currentTab === 'all' ? allOrders : allOrders.filter(o => o.trangThai === currentTab);
        renderOrders(filtered);
    }

    async function loadOrders() {
        try {
            const data = await fetchJson('/api/public/don-hang-cua-toi');
            allOrders = data?.danhSachDonHang || [];
            updateTabCounts();
            filterAndRenderOrders();
            
        } catch (error) {
            els.loading.classList.add('d-none');
            els.error.textContent = error.message;
            els.error.classList.remove('d-none');
        }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTab = btn.dataset.status;
            filterAndRenderOrders();
        });
    });

    function renderStepper(order) {
        const t = order.trangThai;
        
        const steps = [
            { id: 'dat_hang', icon: '<i class="fa fa-shopping-bag"></i>', label: 'Đặt hàng' },
            { id: 'xac_nhan', icon: '<i class="fa fa-file-invoice"></i>', label: 'Xác nhận' },
            { id: 'dang_giao', icon: '<i class="fa fa-truck"></i>', label: 'Đang giao' },
            { id: 'da_nhan', icon: '<i class="fa fa-check"></i>', label: 'Đã nhận' }
        ];

        let currentStepIndex = 0;
        let isFailed = false;

        if (t === 'cho_xac_nhan') currentStepIndex = 0;
        else if (t === 'da_xac_nhan') currentStepIndex = 1;
        else if (t === 'dang_giao') currentStepIndex = 2;
        else if (t === 'da_hoan_thanh') currentStepIndex = 3;
        else if (t === 'da_huy') { currentStepIndex = 1; isFailed = true; }
        else if (t === 'giao_that_bai' || t === 'cho_hoan_tien') { currentStepIndex = 3; isFailed = true; }

        let html = '<div class="order-stepper mt-4">';
        let fillWidth = currentStepIndex * 33.333;
        html += `<div class="step-line-track">`;
        html += `<div class="step-line-fill ${isFailed ? 'failed-line' : ''}" style="width: ${fillWidth}%"></div>`;
        html += `</div>`;

        steps.forEach((step, i) => {
            let className = 'step';
            if (i < currentStepIndex) className += ' completed';
            else if (i === currentStepIndex) {
                if (isFailed) className += ' failed';
                else className += ' active';
            }
            
            let iconHtml = step.icon;
            if (i === currentStepIndex && isFailed) {
                iconHtml = '<i class="fa fa-times"></i>';
                if (t === 'da_huy') step.label = 'Đã hủy';
                if (t === 'giao_that_bai') step.label = 'Giao thất bại';
                if (t === 'cho_hoan_tien') step.label = 'Chờ hoàn tiền';
            }

            html += `
                <div class="${className}">
                    <div class="step-icon">${iconHtml}</div>
                    <div class="step-label">${step.label}</div>
                </div>
            `;
        });
        
        html += '</div>';
        return html;
    }

    async function showDetail(id) {
        els.detailTitle.textContent = 'Chi tiết đơn hàng';
        els.detailDate.textContent = '';
        els.detailError.classList.add('d-none');
        els.detailContent.innerHTML = '<div class="text-center text-muted py-4"><i class="fa fa-spinner fa-spin me-1"></i>Đang tải chi tiết</div>';
        detailModal.show();
        try {
            const data = await fetchJson(`/api/public/don-hang-cua-toi/${encodeURIComponent(id)}`);
            renderDetail(data?.donHang || {});
        } catch (error) {
            els.detailContent.innerHTML = '';
            els.detailError.textContent = error.message;
            els.detailError.classList.remove('d-none');
        }
    }

    async function cancelOrder(id) {
        if (!confirm('Bạn muốn hủy đơn hàng này?')) return;
        const button = document.querySelector(`[data-action="cancel"][data-id="${CSS.escape(String(id))}"]`);
        const oldText = button?.innerHTML;
        if (button) {
            button.disabled = true;
            button.innerHTML = '<i class="fa fa-spinner fa-spin me-1"></i>Đang hủy';
        }
        try {
            await fetchJson(`/api/public/don-hang-cua-toi/${encodeURIComponent(id)}/huy`, { method:'PUT' });
            await loadOrders();
        } catch (error) {
            els.error.textContent = error.message;
            els.error.classList.remove('d-none');
            if (button) {
                button.disabled = false;
                button.innerHTML = oldText;
            }
        }
    }

    function handleReviewClick(button) {
        window.location.href = '/san-pham/' + button.dataset.spid + '#danh-gia-section';
    }

    async function switchCod(id) {
        if (!confirm('Bạn muốn đổi sang thanh toán bằng tiền mặt khi nhận hàng (COD)?')) return;
        const button = document.querySelector(`[data-action="switch-cod"][data-id="${CSS.escape(String(id))}"]`);
        const oldText = button?.innerHTML;
        if (button) {
            button.disabled = true;
            button.innerHTML = '<i class="fa fa-spinner fa-spin me-1"></i>Đang đổi...';
        }
        try {
            const data = await fetchJson(`/api/public/don-hang-cua-toi/${encodeURIComponent(id)}/doi-sang-cod`, { method: 'PUT' });
            alert(data.message || 'Đổi sang COD thành công!');
            loadOrders();
        } catch (error) {
            alert('Lỗi: ' + error.message);
            if (button) {
                button.disabled = false;
                button.innerHTML = oldText;
            }
        }
    }

    async function retryVnPay(id) {
        const button = document.querySelector(`[data-action="retry-vnpay"][data-id="${CSS.escape(String(id))}"]`);
        const oldText = button?.innerHTML;
        if (button) {
            button.disabled = true;
            button.innerHTML = '<i class="fa fa-spinner fa-spin me-1"></i>Đang xử lý...';
        }
        try {
            const data = await fetchJson(`/api/public/don-hang-cua-toi/${encodeURIComponent(id)}/thanh-toan-vnpay-lai`, { method: 'POST' });
            if (data.vnpUrl) {
                window.location.href = data.vnpUrl;
            }
        } catch (error) {
            alert('Lỗi: ' + error.message);
            if (button) {
                button.disabled = false;
                button.innerHTML = oldText;
            }
        }
    }

    els.list.addEventListener('click', event => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const id = button.dataset.id;
        if (button.dataset.action === 'detail') showDetail(id);
        if (button.dataset.action === 'cancel') cancelOrder(id);
        if (button.dataset.action === 'switch-cod') switchCod(id);
        if (button.dataset.action === 'retry-vnpay') retryVnPay(id);
        if (button.dataset.action === 'review') handleReviewClick(button);
    });

    document.getElementById('detail-content').addEventListener('click', event => {
        const button = event.target.closest('button[data-action="review"]');
        if (!button) return;
        handleReviewClick(button);
    });



    loadOrders();

    // Nút Chat với AI mở chatbot panel
    document.getElementById('open-chatbot-btn')?.addEventListener('click', () => {
        const chatbotToggle = document.getElementById('pm-chatbot-toggle');
        if (chatbotToggle) chatbotToggle.click();
        else {
            const panel = document.getElementById('pm-chatbot');
            if (panel) panel.classList.add('open');
        }
    });
</script>
</body>
