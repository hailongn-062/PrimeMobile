<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
    main-layout.html — Tài liệu tham khảo cấu trúc Layout cho PrimeMobile.

    ⚠️  KHÔNG dùng file này làm "parent layout" kiểu thymeleaf-layout-dialect.
    Spring Boot 3.4.x chỉ đi kèm Thymeleaf thuần — KHÔNG có Layout Dialect.

    CÁCH ĐÚNG (đã áp dụng trong index.html):
    ─────────────────────────────────────────
    Mỗi trang HTML tự bao gồm toàn bộ <html>/<head>/<body>, và nhúng các
    fragment Header/Footer trực tiếp bằng cú pháp chuẩn:

        th:replace="~{fragments/header :: navbar}"
        th:replace="~{fragments/footer :: footer}"

    FILE NÀY chỉ lưu CSS chung để IDE có thể gợi ý — không render trực tiếp.
-->
<head>
    <meta charset="UTF-8">
    <title>PrimeMobile — Layout Reference</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet" crossorigin="anonymous">

    <!-- Google Fonts — Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        /* ══════════════════════════════════════════════════════════
           PrimeMobile Design System — CSS Variables & Shared Styles
           Copy các style này vào thẻ <style> của từng trang.
           ══════════════════════════════════════════════════════════ */

        :root {
            --pm-primary:      #0d9488;
            --pm-primary-dark: #115e59;
            --pm-accent:       #d97706;
            --pm-bg-light:     #f8fafc;
            --pm-text-dark:    #0f172a;
            --pm-text-muted:   #64748b;
            --pm-radius:       12px;
            --pm-shadow:       0 4px 20px rgba(13, 148, 136, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--pm-bg-light);
            color: var(--pm-text-dark);
            min-height: 100vh;
        }

        /* Navbar */
        .pm-navbar { background: linear-gradient(135deg, var(--pm-primary) 0%, var(--pm-primary-dark) 100%); }
        .pm-navbar .navbar-brand { font-weight: 800; font-size: 1.4rem; letter-spacing: -.5px; }
        .pm-navbar .nav-link { color: rgba(255,255,255,.85) !important; font-weight: 500; transition: color .2s; }
        .pm-navbar .nav-link:hover { color: #fff !important; }
        .pm-search-bar input { border-radius: var(--pm-radius) 0 0 var(--pm-radius) !important; border: none; }
        .pm-search-bar button { border-radius: 0 var(--pm-radius) var(--pm-radius) 0 !important; background: var(--pm-accent); border: none; }
        .pm-cart-badge { position: relative; }
        .pm-cart-badge .badge { position: absolute; top: -6px; right: -8px; font-size: .6rem; min-width: 18px; }

        /* Brand links (sub-nav) */
        .pm-brand-link { transition: opacity .2s, transform .15s; }
        .pm-brand-link:hover { opacity: 1 !important; transform: scale(1.08); }

        /* Product cards */
        .pm-product-card {
            border: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 12px rgba(15,23,42,.04);
            transition: transform .18s, box-shadow .18s;
            position: relative;
        }
        .pm-product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 32px rgba(21,101,192,.18); }
        .pm-product-card img { height: 200px; object-fit: contain; padding: 12px; background: #fafbff; }
        .pm-img-wrap { position: relative; display: block; overflow: hidden; background: #fafbff; border-radius: 8px 8px 0 0; }
        .pm-favorite-btn {
            background: transparent;
            border: none;
            color: #dc3545; /* Red outline */
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0;
            display: flex;
            align-items: center;
        }
        .pm-favorite-btn:hover {
            color: #dc3545; /* Red on hover */
            transform: scale(1.1);
        }
        .pm-favorite-btn.active {
            color: #dc3545; /* Red when active */
        }
        .pm-favorite-btn.active i {
            font-weight: 900; /* Solid heart */
        }
        .pm-favorite-btn i {
            font-weight: 400; /* Outline heart by default (FontAwesome 5: far) */
        }
        .pm-rating-display {
            font-size: 1rem;
            color: #ffc107;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Category pills */
        .pm-cat-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 50px;
            background: #fff; border: 1.5px solid var(--pm-primary);
            color: var(--pm-primary); font-weight: 600; font-size: .88rem;
            text-decoration: none; transition: all .2s;
            box-shadow: 0 1px 6px rgba(21,101,192,.08);
        }
        .pm-cat-pill:hover, .pm-cat-pill.active { background: var(--pm-primary); color: #fff; }

        /* Section titles */
        .pm-section-title {
            font-weight: 800; font-size: 1.35rem; color: var(--pm-text-dark);
            border-left: 4px solid var(--pm-primary); padding-left: 12px;
        }

        /* Carousel */
        .pm-carousel { border-radius: var(--pm-radius); overflow: hidden; box-shadow: var(--pm-shadow); }
        .pm-carousel .carousel-item { height: 360px; }

        /* Footer */
        .pm-footer { background: var(--pm-primary-dark); color: rgba(255,255,255,.85); }
        .pm-footer a { color: rgba(255,255,255,.7); text-decoration: none; transition: color .2s; }
        .pm-footer a:hover { color: #fff; }
        .pm-footer .pm-footer-title { font-weight: 700; color: #fff; margin-bottom: .75rem; }

        /* Buttons */
        .btn-pm-primary { background: var(--pm-primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; }
        .btn-pm-primary:hover { background: var(--pm-primary-dark); color: #fff; }
        .btn-pm-accent { background: var(--pm-accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; }
        .btn-pm-accent:hover { background: #E65100; color: #fff; }
    </style>
</head>
<body>
    <!-- Trang này không render trực tiếp — xem index.html để biết cách dùng -->
    <p style="font-family:sans-serif;padding:2rem;color:#666;">
        Đây là file layout tham khảo. Xem <a href="/trang-chu">trang chủ</a>.
    </p>
</body>
</html>
