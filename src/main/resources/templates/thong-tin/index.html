<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PrimeMobile'">Thông tin | PrimeMobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --pm-primary:#0d9488; --pm-bg:#f8fafc; --pm-text:#0f172a; --pm-muted:#64748b; --pm-line:#e2e8f0; }
        body { font-family:'Inter',sans-serif; background:var(--pm-bg); color:var(--pm-text); min-height:100vh; }
        .pm-page { padding:32px 0 56px; }
        .pm-panel { background:#fff; border:1px solid var(--pm-line); border-radius:8px; box-shadow:0 10px 28px rgba(15,23,42,.06); }
        .pm-panel-body { padding:28px; }
        .pm-list { display:grid; gap:14px; margin:0; padding:0; list-style:none; }
        .pm-list li { display:flex; gap:12px; color:var(--pm-muted); line-height:1.65; }
        .pm-list i { color:var(--pm-primary); margin-top:5px; }
        .btn-pm { background:var(--pm-primary); color:#fff; border:0; border-radius:8px; font-weight:800; }
        .btn-pm:hover { background:#115e59; color:#fff; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="pm-page">
    <div class="container" style="max-width: 920px;">
        <div class="mb-3">
            <h1 class="h3 mb-1" style="font-weight:900;" th:text="${heading}">Thông tin PrimeMobile</h1>
            <div class="text-muted">PrimeMobile luôn sẵn sàng hỗ trợ bạn</div>
        </div>
        <section class="pm-panel">
            <div class="pm-panel-body">
                <ul class="pm-list">
                    <li th:each="paragraph : ${paragraphs}">
                        <i class="fa fa-circle-check"></i>
                        <span th:text="${paragraph}">Nội dung</span>
                    </li>
                </ul>
                <div class="d-flex flex-wrap gap-2 mt-4">
                    <a href="/san-pham" class="btn btn-pm"><i class="fa fa-mobile-screen me-1"></i> Xem sản phẩm</a>
                    <a href="/" class="btn btn-outline-secondary"><i class="fa fa-house me-1"></i> Trang chủ</a>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
