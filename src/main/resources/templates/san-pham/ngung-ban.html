<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm ngừng kinh doanh | PrimeMobile</title>
    <link rel="icon" href="/images/PrimeMobile_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/trang-chu.css}">
    <style>
        .stopped-container {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
        }
        .stopped-content {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }
        .stopped-icon {
            font-size: 80px;
            color: #dee2e6;
            margin-bottom: 20px;
        }
        .stopped-title {
            font-size: 24px;
            font-weight: 700;
            color: #343a40;
            margin-bottom: 15px;
        }
        .stopped-desc {
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-pm {
            background-color: #0d9488;
            color: white;
            border: none;
        }
        .btn-pm:hover {
            background-color: #0f766e;
            color: white;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Header -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- Main Content -->
    <main class="container py-5 my-4">
        <div class="stopped-container rounded">
            <div class="stopped-content">
                <i class="fa fa-box-open stopped-icon"></i>
                <h1 class="stopped-title">Sản phẩm ngừng kinh doanh</h1>
                <p class="stopped-desc">
                    Rất tiếc, sản phẩm bạn đang tìm kiếm hiện tại đã ngừng kinh doanh tại hệ thống của chúng tôi. 
                    <br>Bạn có thể tham khảo các sản phẩm công nghệ mới nhất đang có sẵn nhé!
                </p>
                <a href="/" class="btn btn-pm px-4 py-2 fw-bold">
                    <i class="fa fa-home me-2"></i> Về trang chủ
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/auth.js}"></script>
    <script th:src="@{/js/cart-count.js}"></script>
</body>
</html>
