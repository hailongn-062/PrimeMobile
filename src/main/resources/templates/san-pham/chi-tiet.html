<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' | PrimeMobile' : 'Chi tiết sản phẩm | PrimeMobile'}">Chi tiết sản phẩm | PrimeMobile</title>
    <link rel="icon" href="/images/PrimeMobile_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --pm-primary:#0d9488; --pm-primary-dark:#115e59; --pm-bg:#f8fafc; --pm-text:#0f172a; --pm-muted:#64748b; --pm-line:#e2e8f0; }
        * { box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--pm-bg); color:var(--pm-text); min-height:100vh; }
        .pm-shell { max-width:1180px; }
        .pm-panel { background:#fff; border:1px solid var(--pm-line); border-radius:8px; box-shadow:0 10px 30px rgba(15,23,42,.06); }
        .pm-main-image { min-height:360px; display:flex; align-items:center; justify-content:center; background:#f9fbff; border-radius:8px; padding:20px; }
        .pm-main-image img { max-width:100%; max-height:330px; object-fit:contain; }
        .pm-image-fallback { width:100%; min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--pm-muted); }
        .pm-image-fallback i { font-size:4rem; opacity:.35; }
        .pm-image-fallback.d-none { display:none!important; }
        .pm-price { color:#ea580c; font-weight:800; font-size:1.65rem; }
        .pm-price-old { color:#94a3b8; font-size:1.1rem; text-decoration:line-through; margin-right:12px; font-weight:500; }
        .pm-variant { border:1px solid var(--pm-line); border-radius:8px; padding:14px; background:#fff; }
        .pm-variant + .pm-variant { margin-top:10px; }
        .pm-variant:hover { border-color:var(--pm-primary); }
        .pm-variant-unavailable { background:#f8fafc; opacity:.82; }
        .pm-stock-badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 9px; font-size:.78rem; font-weight:800; }
        .pm-stock-in { background:#dcfce7; color:#166534; }
        .pm-stock-out { background:#fee2e2; color:#991b1b; }
        .pm-color-dot { width:14px; height:14px; display:inline-block; border-radius:999px; border:1px solid #cbd5e1; vertical-align:-2px; }
        .pm-qty { display:inline-grid; grid-template-columns:34px 54px 34px; height:34px; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden; background:#fff; }
        .pm-qty button { border:0; background:#f8fafc; color:#0f172a; font-weight:800; }
        .pm-qty input { border:0; border-left:1px solid #e2e8f0; border-right:1px solid #e2e8f0; text-align:center; font-weight:800; outline:0; }
        .btn-pm { background:var(--pm-primary); color:#fff; border:0; border-radius:8px; font-weight:800; }
        .btn-pm:hover { background:var(--pm-primary-dark); color:#fff; }
        .btn-pm:disabled { background:#94a3b8; cursor:not-allowed; }
        .btn-buy { background:#ea580c; color:#fff; border:0; border-radius:8px; font-weight:800; }
        .btn-buy:hover { background:#c2410c; color:#fff; }
        .pm-spec-table th { width:34%; color:#475569; font-weight:700; }
        .pm-empty { border:1px dashed #cbd5e1; border-radius:8px; padding:16px; color:#64748b; background:#fff; }
        
        .pm-option-btn { border: 1px solid var(--pm-line); border-radius: 8px; padding: 10px 16px; background: #fff; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .pm-option-btn:hover:not(.disabled) { border-color: var(--pm-primary); }
        .pm-option-btn.active { border-color: #ea580c; background: #fffaf0; color: #ea580c; }
        .pm-option-btn.active::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; top: 0; right: 0; background: #ea580c; color: white; font-size: 10px; padding: 2px 4px; border-bottom-left-radius: 6px; }
        .pm-option-btn.disabled { opacity: 0.5; background: #f8fafc; cursor: not-allowed; text-decoration: line-through; border-color: #e2e8f0; }
        
        .pm-color-info { display: flex; flex-direction: column; line-height: 1.3; }
        .pm-color-name { font-size: 0.9rem; font-weight: 600; color: #0f172a; }
        .pm-color-price { font-size: 0.8rem; font-weight: 500; color: #64748b; }
        .pm-option-btn.active .pm-color-name, .pm-option-btn.active .pm-color-price { color: #ea580c; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container pm-shell py-4">
    <div class="mb-3">
        <a href="/san-pham" class="text-decoration-none fw-bold" style="color:var(--pm-primary);">
            <i class="fa fa-arrow-left me-1"></i> Quay lại danh sách
        </a>
    </div>

    <section class="pm-panel p-3 p-lg-4 mb-4">
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="pm-main-image">
                    <img th:if="${bienTheSanPhams != null and !#lists.isEmpty(bienTheSanPhams) and bienTheSanPhams[0].hinhAnhSanPhams != null and !#lists.isEmpty(bienTheSanPhams[0].hinhAnhSanPhams)}"
                         th:src="${bienTheSanPhams[0].hinhAnhSanPhams[0].duongDan}"
                         th:alt="${sanPham.tenSanPham}"
                         th:attr="data-brand=${sanPham.hangSanXuat != null ? sanPham.hangSanXuat.tenHang : ''}"
                         referrerpolicy="no-referrer"
                         onerror="replaceProductImage(this)">
                    <div th:if="${bienTheSanPhams != null and !#lists.isEmpty(bienTheSanPhams) and bienTheSanPhams[0].hinhAnhSanPhams != null and !#lists.isEmpty(bienTheSanPhams[0].hinhAnhSanPhams)}"
                         class="pm-image-fallback d-none">
                        <i class="fa fa-mobile-alt"></i>
                        <strong th:text="${sanPham.hangSanXuat != null ? sanPham.hangSanXuat.tenHang : 'PrimeMobile'}">PrimeMobile</strong>
                    </div>
                    <div th:unless="${bienTheSanPhams != null and !#lists.isEmpty(bienTheSanPhams) and bienTheSanPhams[0].hinhAnhSanPhams != null and !#lists.isEmpty(bienTheSanPhams[0].hinhAnhSanPhams)}"
                         class="pm-image-fallback">
                        <i class="fa fa-mobile-alt"></i>
                        <strong th:text="${sanPham.hangSanXuat != null ? sanPham.hangSanXuat.tenHang : 'PrimeMobile'}">PrimeMobile</strong>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <span class="badge bg-light text-secondary border mb-2" th:if="${sanPham.hangSanXuat != null}" th:text="${sanPham.hangSanXuat.tenHang}">Hãng</span>
                <h1 class="h3 fw-bold mb-2" th:text="${sanPham.tenSanPham}">Tên sản phẩm</h1>
                <p class="text-muted" th:if="${sanPham.moTaNgan != null and !#strings.isEmpty(sanPham.moTaNgan)}" th:text="${sanPham.moTaNgan}">Mô tả ngắn</p>

                <!-- Container động cho biến thể -->
                <div id="product-variants-container" class="d-none">
                    <!-- Khu vực hiển thị giá chung -->
                    <div class="mb-3">
                        <span id="display-price-old" class="pm-price-old d-none"></span>
                        <span id="display-price" class="pm-price"></span>
                    </div>

                    <!-- Khu vực Phiên bản (Dung lượng) -->
                    <h2 class="h6 fw-bold mb-2">Phiên bản</h2>
                    <div id="versions-container" class="d-flex flex-wrap gap-2 mb-3">
                        <!-- Render by JS -->
                    </div>

                    <!-- Khu vực Màu sắc -->
                    <h2 class="h6 fw-bold mb-2">Màu sắc</h2>
                    <div id="colors-container" class="d-flex flex-wrap gap-2 mb-3">
                        <!-- Render by JS -->
                    </div>

                    <!-- Khu vực Thông tin biến thể đã chọn (Stock, Buy Buttons) -->
                    <div class="pm-variant mt-3" id="selected-variant-info">
                        <div class="d-flex flex-column flex-xl-row justify-content-between gap-3">
                            <div>
                                <div class="fw-bold" id="selected-variant-title">
                                    <!-- Render by JS -->
                                </div>
                                <div class="small text-muted" id="selected-variant-sku">SKU</div>
                                <div class="mt-2 d-flex flex-wrap gap-2 align-items-center" id="selected-variant-stock-status">
                                    <!-- Render by JS -->
                                </div>
                            </div>
                            <div class="text-xl-end d-flex flex-column justify-content-end align-items-xl-end">
                                <div class="d-flex flex-wrap justify-content-xl-end align-items-center gap-2">
                                    <div class="pm-qty" id="qty-container">
                                        <button type="button" title="Giảm số lượng" onclick="stepQty(this, -1)">-</button>
                                        <input type="number" value="1" min="1" id="qty-input" inputmode="numeric" aria-label="Số lượng">
                                        <button type="button" title="Tăng số lượng" onclick="stepQty(this, 1)">+</button>
                                    </div>
                                    <button class="btn btn-pm btn-sm" id="btn-add-cart" type="button" onclick="addToCart(this, false)">
                                        <i class="fa fa-cart-plus me-1"></i> Thêm
                                    </button>
                                    <button class="btn btn-buy btn-sm" id="btn-buy-now" type="button" onclick="addToCart(this, true)">
                                        <i class="fa fa-credit-card me-1"></i> Mua ngay
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="product-empty-message" class="pm-empty" th:if="${bienTheSanPhams == null or #lists.isEmpty(bienTheSanPhams)}">
                    Sản phẩm này chưa có phiên bản để bán.
                </div>
            </div>
        </div>
    </section>

    <section class="pm-panel p-3 p-lg-4 mb-4">
        <h2 class="h5 fw-bold mb-3">Thông số kỹ thuật</h2>
        <div th:if="${thongSoKyThuatGrouped != null and !#maps.isEmpty(thongSoKyThuatGrouped)}">
            <div th:each="entry : ${thongSoKyThuatGrouped}" class="mb-4">
                <h3 class="h6 fw-bold mb-3 text-dark" th:text="${entry.key}">Nhóm</h3>
                <div class="border rounded bg-white overflow-hidden">
                    <table class="table table-borderless mb-0 align-middle pm-spec-table">
                        <tbody>
                        <tr th:each="ts, iterStat : ${entry.value}" th:class="${!iterStat.last ? 'border-bottom' : ''}">
                            <th class="fw-normal text-dark" style="width: 35%; padding: 12px 16px; background: #f8fafc;" th:text="${ts.tenThongSo}">Thông số</th>
                            <td class="text-dark" style="padding: 12px 16px;" th:text="${ts.giaTri}">Giá trị</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="pm-empty" th:if="${thongSoKyThuatGrouped == null or #maps.isEmpty(thongSoKyThuatGrouped)}">
            Chưa có thông số kỹ thuật cho sản phẩm này.
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const currentCustomerId = /*[[${session.CURRENT_CUSTOMER != null ? session.CURRENT_CUSTOMER.khachHangId : null}]]*/ null;
    const variantsDataRaw = /*[[${variantsJson}]]*/ null;
    const variantsData = variantsDataRaw || [];
    const minStock = /*[[${tonKhoToiThieuDeBan}]]*/ 5;

    function brandFallbackImage(img) {
        const text = `${img.dataset.brand || ''} ${img.alt || ''}`.toLowerCase();
        if (text.includes('apple') || text.includes('iphone')) return '/images/brands/apple.png';
        if (text.includes('samsung')) return '/images/brands/samsung.png';
        if (text.includes('xiaomi') || text.includes('redmi')) return '/images/brands/xiaomi.png';
        if (text.includes('oppo')) return '/images/brands/oppo.png';
        if (text.includes('vivo')) return '/images/brands/vivo.png';
        return '/images/PrimeMobile_logo.png';
    }

    function replaceProductImage(img) {
        const fallbackSrc = brandFallbackImage(img);
        if (!img.dataset.fallbackApplied && img.getAttribute('src') !== fallbackSrc) {
            img.dataset.fallbackApplied = 'true';
            img.src = fallbackSrc;
            img.classList.remove('d-none');
            return;
        }
        img.classList.add('d-none');
        const fallback = img.parentElement ? img.parentElement.querySelector('.pm-image-fallback') : null;
        if (fallback) fallback.classList.remove('d-none');
    }

    function stepQty(button, delta) {
        const input = button.parentElement.querySelector('input');
        const max = Number(input.max || 1);
        const next = Math.min(Math.max(Number(input.value || 1) + delta, 1), max);
        input.value = next;
    }

    function readQty(button) {
        const variant = button.closest('.pm-variant');
        const input = variant ? variant.querySelector('.pm-qty input') : null;
        const max = Number(button.dataset.max || 0);
        const qty = Number(input ? input.value : 1);
        if (!Number.isInteger(qty) || qty < 1 || qty > max) {
            throw new Error(`Bạn chỉ có thể đặt từ 1 đến ${max} sản phẩm.`);
        }
        return qty;
    }

    function getGuestSessionId() {
        const key = 'pm_guest_session_id';
        let sessionId = localStorage.getItem(key);
        if (!sessionId) {
            sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
            localStorage.setItem(key, sessionId);
        }
        return sessionId;
    }

    // --- LOGIC XỬ LÝ BIẾN THỂ ĐỘNG ---
    let selectedVersion = null;
    let selectedColor = null;

    function initVariants() {
        if (!variantsData || variantsData.length === 0) return;
        document.getElementById('product-variants-container').classList.remove('d-none');
        const emptyMsg = document.getElementById('product-empty-message');
        if (emptyMsg) emptyMsg.classList.add('d-none');

        // Lấy danh sách Version (RAM/ROM) và Color độc nhất
        const versions = [...new Set(variantsData.map(v => v.versionKey))];
        
        // Mặc định chọn version đầu tiên và màu đầu tiên khả dụng của version đó
        if (versions.length > 0) {
            selectedVersion = versions[0];
            const availableColors = variantsData.filter(v => v.versionKey === selectedVersion).map(v => v.mauSac);
            if (availableColors.length > 0) {
                selectedColor = availableColors[0];
            }
        }
        
        renderVersionButtons();
        renderColorButtons();
        updateSelectedVariantUI();
    }

    function renderVersionButtons() {
        const versions = [...new Set(variantsData.map(v => v.versionKey))];
        const container = document.getElementById('versions-container');
        container.innerHTML = '';
        
        versions.forEach(ver => {
            // Kiểm tra xem version này có bất kỳ biến thể nào còn hàng không
            const isAvailable = variantsData.some(v => v.versionKey === ver && v.trangThai === 'con_hang' && v.coTheBan > 0);
            
            const btn = document.createElement('div');
            btn.className = `pm-option-btn ${selectedVersion === ver ? 'active' : ''} ${!isAvailable ? 'disabled' : ''}`;
            btn.innerText = ver;
            btn.onclick = () => {
                selectedVersion = ver;
                
                // Khi đổi version, cần kiểm tra màu sắc đang chọn có khả dụng trong version mới không
                const availableForNewVersion = variantsData.filter(v => v.versionKey === ver);
                const colorStillExists = availableForNewVersion.some(v => v.mauSac === selectedColor);
                if (!colorStillExists && availableForNewVersion.length > 0) {
                    selectedColor = availableForNewVersion[0].mauSac; // Tự động nhảy sang màu khác
                }
                
                renderVersionButtons();
                renderColorButtons();
                updateSelectedVariantUI();
            };
            container.appendChild(btn);
        });
    }

    function renderColorButtons() {
        // Màu sắc hiển thị sẽ dựa trên version đang chọn
        const allColors = [];
        const colorMap = new Map();
        
        variantsData.forEach(v => {
            if (!colorMap.has(v.mauSac)) {
                colorMap.set(v.mauSac, v.maMauHex);
                allColors.push({ name: v.mauSac, hex: v.maMauHex });
            }
        });

        const container = document.getElementById('colors-container');
        container.innerHTML = '';
        
        allColors.forEach(color => {
            // Kiểm tra xem màu này CÓ trong version đang chọn không, và có CÒN HÀNG không
            const variantForColor = variantsData.find(v => v.versionKey === selectedVersion && v.mauSac === color.name);
            const isAvailable = variantForColor && variantForColor.trangThai === 'con_hang' && variantForColor.coTheBan > 0;
            const doesNotExist = !variantForColor; // Màu này không sx cho version này

            const btn = document.createElement('div');
            btn.className = `pm-option-btn ${selectedColor === color.name ? 'active' : ''} ${(!isAvailable || doesNotExist) ? 'disabled' : ''}`;
            
            let priceHtml = '';
            if (variantForColor) {
                priceHtml = `<span class="pm-color-price">${formatCurrency(variantForColor.giaSauKM)}</span>`;
            }

            btn.innerHTML = `
                <div class="pm-color-info">
                    <span class="pm-color-name">${color.name}</span>
                </div>
            `;
            
            // Không cho click nếu không tồn tại, nhưng nếu hết hàng vẫn có thể click để xem (tùy nghiệp vụ, ở đây vẫn cho click)
            if (!doesNotExist) {
                btn.onclick = () => {
                    selectedColor = color.name;
                    renderColorButtons();
                    updateSelectedVariantUI();
                };
            }
            container.appendChild(btn);
        });
    }

    function formatCurrency(num) {
        if (!num) return '0₫';
        return Number(num).toLocaleString('vi-VN') + '₫';
    }

    function updateSelectedVariantUI() {
        const variant = variantsData.find(v => v.versionKey === selectedVersion && v.mauSac === selectedColor);
        
        const priceOldEl = document.getElementById('display-price-old');
        const priceEl = document.getElementById('display-price');
        const titleEl = document.getElementById('selected-variant-title');
        const skuEl = document.getElementById('selected-variant-sku');
        const stockEl = document.getElementById('selected-variant-stock-status');
        
        const btnAdd = document.getElementById('btn-add-cart');
        const btnBuy = document.getElementById('btn-buy-now');
        const qtyInput = document.getElementById('qty-input');
        const qtyContainer = document.getElementById('qty-container');

        if (!variant) {
            priceEl.innerText = "Liên hệ";
            priceOldEl.classList.add('d-none');
            titleEl.innerHTML = "Phiên bản không tồn tại";
            skuEl.innerText = "";
            stockEl.innerHTML = "";
            btnAdd.disabled = true;
            btnBuy.disabled = true;
            qtyContainer.style.display = 'none';
            return;
        }

        // Đổi hình ảnh chính
        if (variant.hinhAnh) {
            const mainImg = document.querySelector('.pm-main-image img');
            if (mainImg) mainImg.src = variant.hinhAnh;
        }

        // Cập nhật giá
        priceEl.innerText = formatCurrency(variant.giaSauKM);
        if (variant.giaSauKM < variant.giaBan) {
            priceOldEl.innerText = formatCurrency(variant.giaBan);
            priceOldEl.classList.remove('d-none');
        } else {
            priceOldEl.classList.add('d-none');
        }

        // Cập nhật thông tin text
        titleEl.innerHTML = `<span class="pm-color-dot me-1" style="background-color:${variant.maMauHex}"></span> 
                            <span>${variant.mauSac}</span> <span class="text-muted"> · ${variant.versionKey}</span>`;
        skuEl.innerText = `SKU: ${variant.sku}`;

        // Trạng thái tồn kho
        const canBuy = variant.trangThai === 'con_hang' && variant.coTheBan > 0;
        if (canBuy) {
            stockEl.innerHTML = `
                <span class="pm-stock-badge pm-stock-in"><i class="fa fa-check-circle"></i> Còn hàng</span>
                <span class="small text-muted">Có thể đặt: <strong>${variant.coTheBan}</strong></span>
            `;
            qtyContainer.style.display = 'inline-grid';
            qtyInput.max = variant.coTheBan;
            if (Number(qtyInput.value) > variant.coTheBan) qtyInput.value = variant.coTheBan;
            
            btnAdd.disabled = false;
            btnBuy.disabled = false;
            btnAdd.dataset.bienTheId = variant.id;
            btnAdd.dataset.max = variant.coTheBan;
            btnBuy.dataset.bienTheId = variant.id;
            btnBuy.dataset.max = variant.coTheBan;
        } else {
            stockEl.innerHTML = `
                <span class="pm-stock-badge pm-stock-out"><i class="fa fa-times-circle"></i> Hết hàng</span>
                <span class="small text-muted">Chỉ bán khi tồn kho lớn hơn ${minStock}.</span>
            `;
            qtyContainer.style.display = 'none';
            btnAdd.disabled = true;
            btnBuy.disabled = true;
        }
    }

    // Khởi tạo giao diện
    document.addEventListener("DOMContentLoaded", function() {
        try {
            initVariants();
        } catch (e) {
            console.error("Lỗi khởi tạo biến thể:", e);
            const container = document.getElementById('product-variants-container');
            if (container) {
                container.classList.remove('d-none');
                container.innerHTML = `<div class="alert alert-danger mt-3 fw-bold">
                    <i class="fa fa-exclamation-triangle"></i> Lỗi xử lý JavaScript: ${e.message}<br>
                    <small>Vui lòng chụp ảnh màn hình và báo lại cho Admin.</small>
                </div>`;
            }
        }
    });

    async function addToCart(button, buyNow) {
        let soLuong;
        try {
            soLuong = readQty(button);
        } catch (error) {
            alert(error.message);
            return;
        }

        const bienTheSanPhamId = Number(button.dataset.bienTheId);
        const oldHtml = button.innerHTML;
        button.disabled = true;
        button.innerHTML = '<i class="fa fa-spinner fa-spin me-1"></i>Đang xử lý';

        try {
            const response = await fetch('/api/public/gio-hang/them', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify({
                    khachHangId: currentCustomerId,
                    sessionId: currentCustomerId ? null : getGuestSessionId(),
                    bienTheSanPhamId,
                    soLuong
                })
            });

            if (!response.ok) {
                const message = await response.text();
                throw new Error(message || 'Không thể thêm vào giỏ hàng.');
            }

            const cartCount = document.getElementById('cart-count');
            if (cartCount) cartCount.textContent = String(Number(cartCount.textContent || 0) + soLuong);
            if (buyNow) {
                window.location.href = currentCustomerId ? '/thanh-toan' : '/dang-nhap';
                return;
            }
            alert('Đã thêm sản phẩm vào giỏ hàng.');
        } catch (error) {
            alert(error.message || 'Có lỗi xảy ra khi thêm sản phẩm.');
        } finally {
            button.disabled = false;
            button.innerHTML = oldHtml;
        }
    }
</script>
</body>
</html>
