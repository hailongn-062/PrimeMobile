<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' | PrimeMobile'}">Chi tiết khuyến mãi | PrimeMobile</title>
    <link rel="icon" href="/images/PrimeMobile_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --pm-primary:#0d9488; --pm-primary-dark:#115e59; --pm-bg:#f8fafc; --pm-text:#0f172a; --pm-line:#e2e8f0; }
        body { font-family:'Inter',sans-serif; background:var(--pm-bg); color:var(--pm-text); min-height:100vh; }
        .pm-shell { max-width:1080px; }
        .pm-panel { background:#fff; border:1px solid var(--pm-line); border-radius:8px; box-shadow:0 8px 24px rgba(15,23,42,.06); }
        .pm-badge { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 10px; font-size:.78rem; font-weight:800; background:#e6fffb; color:#0f766e; }
        .btn-pm { background:var(--pm-primary); color:#fff; border:0; border-radius:8px; font-weight:800; }
        .btn-pm:hover { background:var(--pm-primary-dark); color:#fff; }
        .pm-empty { border:1px dashed #cbd5e1; border-radius:8px; padding:16px; color:#64748b; background:#fff; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container pm-shell py-4">
    <div class="mb-3">
        <a href="/khuyen-mai" class="text-decoration-none fw-bold" style="color:var(--pm-primary);">
            <i class="fa fa-arrow-left me-1"></i> Quay lại khuyến mãi
        </a>
    </div>

    <section class="pm-panel p-3 p-lg-4 mb-4">
        <div class="d-flex flex-wrap gap-2 mb-3">
            <span class="pm-badge">
                <i class="fa fa-gift"></i>
                <span th:text="${khuyenMai.loai == 'don_hang_toi_thieu' ? 'Đơn hàng tối thiểu' : (khuyenMai.loai == 'phan_tram' ? 'Giảm phần trăm' : 'Giảm trực tiếp')}">Loại</span>
            </span>
            <span class="pm-badge" th:text="${khuyenMai.trangThai == 'chua_bat_dau' ? 'Sắp diễn ra' : (khuyenMai.trangThai == 'dang_dien_ra' ? 'Đang diễn ra' : 'Tạm dừng')}">Trạng thái</span>
        </div>
        <h1 class="h3 fw-bold" th:text="${khuyenMai.tenCtkm}">Tên chương trình</h1>
        <p class="text-muted" th:text="${khuyenMai.moTa != null and !#strings.isEmpty(khuyenMai.moTa) ? khuyenMai.moTa : 'Ưu đãi được áp dụng theo điều kiện của chương trình.'}">Mô tả</p>

        <div class="row g-3 mt-2">
            <div class="col-md-6">
                <div class="border rounded-3 p-3 h-100">
                    <div class="text-muted small">Thời gian bắt đầu</div>
                    <div class="fw-bold" th:text="${#temporals.format(khuyenMai.ngayBatDau, 'dd/MM/yyyy HH:mm')}">01/01/2026</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="border rounded-3 p-3 h-100">
                    <div class="text-muted small">Thời gian kết thúc</div>
                    <div class="fw-bold" th:text="${#temporals.format(khuyenMai.ngayKetThuc, 'dd/MM/yyyy HH:mm')}">01/01/2026</div>
                </div>
            </div>
            <div class="col-md-6" th:if="${khuyenMai.giaTriUuDai != null}">
                <div class="border rounded-3 p-3 h-100">
                    <div class="text-muted small">Giá trị ưu đãi</div>
                    <div class="fw-bold text-danger" th:text="${#numbers.formatDecimal(khuyenMai.giaTriUuDai, 0, 'COMMA', 0, 'POINT')}">0</div>
                </div>
            </div>
            <div class="col-md-6" th:if="${khuyenMai.donHangToiThieu != null}">
                <div class="border rounded-3 p-3 h-100">
                    <div class="text-muted small">Đơn hàng tối thiểu</div>
                    <div class="fw-bold" th:text="${#numbers.formatDecimal(khuyenMai.donHangToiThieu, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</div>
                </div>
            </div>
            <div class="col-md-6" th:if="${khuyenMai.giamToiDa != null}">
                <div class="border rounded-3 p-3 h-100">
                    <div class="text-muted small">Giảm tối đa</div>
                    <div class="fw-bold text-warning" th:text="${#numbers.formatDecimal(khuyenMai.giamToiDa, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</div>
                </div>
            </div>
        </div>
    </section>

    <section class="pm-panel p-3 p-lg-4 mb-4">
        <h2 class="h5 fw-bold mb-3">Sản phẩm áp dụng</h2>
        <div class="row g-2" th:if="${phamVis != null and !#lists.isEmpty(phamVis)}">
            <div class="col-md-6" th:each="pv : ${phamVis}">
                <a class="d-block border rounded-3 p-3 text-decoration-none text-dark"
                   th:if="${pv.sanPham != null}"
                   th:href="@{/san-pham/{id}(id=${pv.sanPham.id})}">
                    <strong th:text="${pv.sanPham.tenSanPham}">Tên sản phẩm</strong>
                    <div class="small text-muted">Xem sản phẩm</div>
                </a>
            </div>
        </div>
        <div class="pm-empty" th:if="${phamVis == null or #lists.isEmpty(phamVis)}">Áp dụng theo điều kiện chung của chương trình.</div>
    </section>

    <div class="mb-4">
        <a href="/san-pham" class="btn btn-pm"><i class="fa fa-mobile-screen me-1"></i> Xem sản phẩm</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
