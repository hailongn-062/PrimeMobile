<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' | PrimeMobile'}">Khuyến mãi | PrimeMobile</title>
    <link rel="icon" href="/images/PrimeMobile_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --pm-primary:#0d9488; --pm-primary-dark:#115e59; --pm-bg:#f8fafc; --pm-text:#0f172a; --pm-line:#e2e8f0; }
        body { font-family:'Inter',sans-serif; background:var(--pm-bg); color:var(--pm-text); min-height:100vh; }
        .pm-shell { max-width:1180px; }
        .pm-page-title { font-weight:800; border-left:4px solid var(--pm-primary); padding-left:12px; }
        .pm-promo-card { background:#fff; border:1px solid var(--pm-line); border-radius:8px; padding:18px; height:100%; box-shadow:0 8px 24px rgba(15,23,42,.06); }
        .pm-promo-type { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 10px; font-size:.78rem; font-weight:800; background:#e6fffb; color:#0f766e; }
        .pm-status { display:inline-flex; border-radius:999px; padding:4px 9px; font-size:.76rem; font-weight:800; background:#dcfce7; color:#166534; }
        .pm-status.waiting { background:#fef3c7; color:#92400e; }
        .btn-pm { background:var(--pm-primary); color:#fff; border:0; border-radius:8px; font-weight:800; }
        .btn-pm:hover { background:var(--pm-primary-dark); color:#fff; }
        .pm-empty { background:#fff; border:1px solid var(--pm-line); border-radius:8px; padding:44px 20px; text-align:center; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container pm-shell py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <h1 class="pm-page-title h3 mb-1">Khuyến mãi PrimeMobile</h1>
            <div class="text-muted small">
                <span th:text="${danhSachKhuyenMai != null ? danhSachKhuyenMai.size() : 0}">0</span> chương trình
            </div>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="/khuyen-mai"><i class="fa fa-gift me-1"></i>Khuyến mãi</a>
        </div>
    </div>

    <div class="row g-3" th:if="${danhSachKhuyenMai != null and !#lists.isEmpty(danhSachKhuyenMai)}">
        <div class="col-md-6 col-xl-4" th:each="km : ${danhSachKhuyenMai}">
            <article class="pm-promo-card d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
                    <span class="pm-promo-type">
                        <i class="fa fa-gift"></i>
                        <span th:text="${km.loai == 'theo_don_hang' ? 'Theo Đơn Hàng' : 'Theo Sản Phẩm'}">Loại</span>
                    </span>
                    <span class="pm-status" th:classappend="${km.trangThai == 'chua_bat_dau'} ? ' waiting' : ''"
                          th:text="${km.trangThai == 'chua_bat_dau' ? 'Sắp diễn ra' : 'Đang diễn ra'}">Trạng thái</span>
                </div>
                <h2 class="h5 fw-bold" th:text="${km.tenCtkm}">Tên chương trình</h2>
                <p class="text-muted small flex-grow-1" th:text="${km.moTa != null and !#strings.isEmpty(km.moTa) ? km.moTa : 'Ưu đãi đang được PrimeMobile áp dụng theo điều kiện chương trình.'}">Mô tả</p>
                <div class="small text-muted mb-3">
                    <div><i class="fa fa-calendar me-1"></i><span th:text="${#temporals.format(km.ngayBatDau, 'dd/MM/yyyy HH:mm')}">01/01/2026</span></div>
                    <div><i class="fa fa-clock me-1"></i><span th:text="${#temporals.format(km.ngayKetThuc, 'dd/MM/yyyy HH:mm')}">01/01/2026</span></div>
                </div>
                <a class="btn btn-pm btn-sm mt-auto" th:href="@{/khuyen-mai/{id}(id=${km.id})}">
                    <i class="fa fa-eye me-1"></i> Xem chi tiết
                </a>
            </article>
        </div>
    </div>

    <div class="pm-empty" th:if="${danhSachKhuyenMai == null or #lists.isEmpty(danhSachKhuyenMai)}">
        <i class="fa fa-gift fa-3x text-muted opacity-50 mb-3"></i>
        <h2 class="h5 fw-bold">Chưa có chương trình phù hợp</h2>
        <p class="text-muted mb-0">Các ưu đãi mới sẽ được cập nhật tại đây.</p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
