<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Danh Mục - PrimeMobile</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="mb-3">
            <a href="/admin/san-pham" class="text-decoration-none text-muted fw-semibold" style="font-size: 0.9rem;">
                <i class="fa fa-arrow-left me-1"></i> Quay lại danh sách
            </a>
        </div>
        <div class="pm-card">
            <div class="pm-card-header">
                Danh sách Danh mục
                <a href="/admin/danh-muc/form" class="btn btn-primary btn-sm">
                    <i class="fa fa-plus"></i> Thêm mới
                </a>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Tên danh mục</th>
                            <th>Slug</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="dm : ${danhMucs}">
                            <td th:text="${dm.id}">1</td>
                            <td class="fw-bold" th:text="${dm.tenDanhMuc}">Điện thoại</td>
                            <td th:text="${dm.slug}">dien-thoai</td>
                            <td>
                                <span th:if="${dm.kichHoat}" class="badge bg-success">Đang hoạt động</span>
                                <span th:unless="${dm.kichHoat}" class="badge bg-secondary">Đã ẩn</span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/danh-muc/form(id=${dm.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fa fa-edit"></i> Sửa
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(danhMucs)}">
                            <td colspan="5" class="text-center py-3 text-muted">Chưa có danh mục nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
