<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Trung tâm bảo hành - PrimeMobile</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="pm-card">
            <div class="pm-card-header">
                Danh sách Trung tâm bảo hành
                <a href="/admin/trung-tam-bao-hanh/form" class="btn btn-primary btn-sm">
                    <i class="fa fa-plus"></i> Thêm mới
                </a>
            </div>
            
            <div class="card-body p-3 bg-light border-bottom">
                <form method="get" action="/admin/trung-tam-bao-hanh/danh-sach" class="row g-2 align-items-center">
                    <div class="col-md-5">
                        <input type="text" name="tuKhoa" th:value="${tuKhoa}" class="form-control form-control-sm" placeholder="Tìm theo Tên, SĐT, Người liên hệ..." />
                    </div>
                    <div class="col-md-3">
                        <select name="trangThai" class="form-select form-select-sm">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option value="hoat_dong" th:selected="${trangThai == 'hoat_dong'}">Hoạt động</option>
                            <option value="ngung_hoat_dong" th:selected="${trangThai == 'ngung_hoat_dong'}">Ngừng hoạt động</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-sm btn-secondary">
                            <i class="fa fa-search"></i> Tìm kiếm
                        </button>
                        <a href="/admin/trung-tam-bao-hanh/danh-sach" class="btn btn-sm btn-outline-secondary ms-1">
                            <i class="fa fa-sync-alt"></i> Làm mới
                        </a>
                    </div>
                </form>
            </div>

            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tên Trung Tâm</th>
                            <th>Liên hệ</th>
                            <th>Địa chỉ</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tt : ${ttbhPage.content}">
                            <td class="fw-bold text-primary" th:text="${tt.tenTrungTam}"></td>
                            <td>
                                <div><i class="fa fa-user text-muted small"></i> <span th:text="${tt.nguoiLienHe ?: '---'}"></span></div>
                                <div><i class="fa fa-phone text-muted small"></i> <span th:text="${tt.soDienThoai ?: '---'}"></span></div>
                            </td>
                            <td><span th:text="${tt.diaChi ?: '---'}"></span></td>
                            <td>
                                <span th:if="${tt.trangThai == 'hoat_dong'}" class="badge bg-success">Hoạt động</span>
                                <span th:if="${tt.trangThai == 'ngung_hoat_dong'}" class="badge bg-secondary">Ngừng hoạt động</span>
                            </td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-toggle-status" th:attr="data-id=${tt.id}"
                                   th:classappend="${tt.trangThai == 'hoat_dong' ? 'btn-outline-secondary' : 'btn-outline-success'}"
                                   title="Đổi trạng thái">
                                    <i th:class="${tt.trangThai == 'hoat_dong' ? 'fa fa-ban' : 'fa fa-check'}"></i>
                                </button>
                                <a th:href="@{/admin/trung-tam-bao-hanh/form(id=${tt.id})}" class="btn btn-sm btn-outline-primary ms-1" title="Sửa">
                                    <i class="fa fa-edit"></i> Sửa
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ttbhPage.content)}">
                            <td colspan="5" class="text-center py-4 text-muted">Không tìm thấy trung tâm bảo hành nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Phân trang -->
            <div class="card-footer" th:if="${ttbhPage.totalPages > 1}">
                <ul class="pagination pagination-sm mb-0 justify-content-end">
                    <li class="page-item" th:classappend="${ttbhPage.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/trung-tam-bao-hanh/danh-sach(page=${ttbhPage.number - 1}, tuKhoa=${tuKhoa}, trangThai=${trangThai})}">Trước</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="${'Trang ' + (ttbhPage.number + 1) + ' / ' + ttbhPage.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${ttbhPage.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/trung-tam-bao-hanh/danh-sach(page=${ttbhPage.number + 1}, tuKhoa=${tuKhoa}, trangThai=${trangThai})}">Sau</a>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.btn-toggle-status').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const id = this.getAttribute('data-id');
                    if (confirm('Bạn có chắc muốn thay đổi trạng thái trung tâm bảo hành này?')) {
                        fetch(`/api/admin/trung-tam-bao-hanh/${id}/trang-thai`, {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        })
                        .then(res => {
                            if (!res.ok) {
                                return res.json().then(err => { throw new Error(err.message || 'Lỗi hệ thống'); });
                            }
                            return res.json();
                        })
                        .then(data => {
                            window.location.reload();
                        })
                        .catch(err => {
                            alert(err.message);
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
