<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Sản Phẩm - PrimeMobile</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="pm-card">
            <div class="pm-card-header">
                Danh sách Sản Phẩm
                <div>
                    <a href="/admin/danh-muc" class="btn btn-outline-secondary btn-sm me-2">
                        <i class="fa fa-folder"></i> Danh mục
                    </a>
                    <a href="/admin/hang-san-xuat" class="btn btn-outline-secondary btn-sm me-2">
                        <i class="fa fa-industry"></i> Hãng SX
                    </a>
                    <a href="/admin/san-pham/form" class="btn btn-primary btn-sm">
                        <i class="fa fa-plus"></i> Thêm Sản Phẩm
                    </a>
                </div>
            </div>
            
            <div class="card-body p-3 bg-light border-bottom">
                <form method="get" action="/admin/san-pham" class="row g-2 align-items-center">
                    <div class="col-auto">
                        <select name="danhMucId" class="form-select form-select-sm">
                            <option value="">-- Tất cả danh mục --</option>
                            <option th:each="dm : ${danhMucs}" th:value="${dm.id}" th:text="${dm.tenDanhMuc}" th:selected="${dm.id == selectedDanhMucId}"></option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <select name="hangSanXuatId" class="form-select form-select-sm">
                            <option value="">-- Tất cả hãng SX --</option>
                            <option th:each="hsx : ${hangSanXuats}" th:value="${hsx.id}" th:text="${hsx.tenHang}" th:selected="${hsx.id == selectedHangSanXuatId}"></option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-sm btn-secondary">Lọc</button>
                    </div>
                </form>
            </div>

            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Mã SP</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Danh mục</th>
                            <th>Hãng SX</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sp : ${sanPhamPage.content}">
                            <td th:text="${sp.id}">1</td>
                            <td th:text="${sp.maSanPham}">SP01</td>
                            <td class="fw-bold" th:text="${sp.tenSanPham}">iPhone 15</td>
                            <td th:text="${sp.danhMuc.tenDanhMuc}">Điện thoại</td>
                            <td th:text="${sp.hangSanXuat.tenHang}">Apple</td>
                            <td>
                                <span th:if="${sp.trangThai == 'dang_ban'}" class="badge bg-success">Đang bán</span>
                                <span th:if="${sp.trangThai == 'ngung_ban'}" class="badge bg-danger">Ngừng bán</span>
                                <span th:if="${sp.trangThai == 'sap_ra_mat'}" class="badge bg-warning text-dark">Sắp ra mắt</span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/san-pham/{id}/chi-tiet(id=${sp.id})}" class="btn btn-sm btn-outline-info">
                                    <i class="fa fa-list"></i> Chi tiết
                                </a>
                                <a th:href="@{/admin/san-pham/form(id=${sp.id})}" class="btn btn-sm btn-outline-primary ms-1">
                                    <i class="fa fa-edit"></i> Sửa
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(sanPhamPage.content)}">
                            <td colspan="7" class="text-center py-3 text-muted">Không có sản phẩm nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Phân trang cơ bản -->
            <div class="card-footer" th:if="${sanPhamPage.totalPages > 1}">
                <ul class="pagination pagination-sm mb-0 justify-content-end">
                    <li class="page-item" th:classappend="${sanPhamPage.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/san-pham(page=${sanPhamPage.number - 1}, danhMucId=${selectedDanhMucId}, hangSanXuatId=${selectedHangSanXuatId})}">Trước</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="${'Trang ' + (sanPhamPage.number + 1) + ' / ' + sanPhamPage.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${sanPhamPage.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/san-pham(page=${sanPhamPage.number + 1}, danhMucId=${selectedDanhMucId}, hangSanXuatId=${selectedHangSanXuatId})}">Sau</a>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
