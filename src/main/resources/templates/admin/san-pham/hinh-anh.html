<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle} + ' - PrimeMobile'">Quản lý Ảnh Biến Thể</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        .sortable-ghost { opacity: 0.4; background-color: #f8f9fa; }
        .image-card-container { cursor: grab; }
        .image-card-container:active { cursor: grabbing; }
    </style>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="mb-3">
            <a th:href="@{/admin/san-pham/{id}/chi-tiet(id=${bienThe.sanPham.id})}" class="btn btn-sm btn-outline-secondary">
                <i class="fa fa-arrow-left"></i> Quay lại Chi tiết Sản phẩm
            </a>
        </div>

        <div class="pm-card mb-4" style="max-width: 800px; margin: 0 auto;">
            <div class="pm-card-header d-flex justify-content-between align-items-center">
                <span>Thông tin Biến thể</span>
                <span class="badge bg-primary" th:text="${bienThe.maSku}">SKU</span>
            </div>
            <div class="card-body bg-light">
                <div class="row">
                    <div class="col-md-4">
                        <p class="mb-1"><strong>Sản phẩm:</strong> <span th:text="${bienThe.sanPham.tenSanPham}"></span></p>
                    </div>
                    <div class="col-md-4">
                        <p class="mb-1"><strong>Màu sắc:</strong> 
                            <span th:text="${bienThe.mauSacTen}"></span>
                        </p>
                    </div>
                    <div class="col-md-4">
                        <p class="mb-1"><strong>RAM/ROM:</strong> <span th:text="${bienThe.ramGb} + 'GB / ' + ${bienThe.luuTruGb} + 'GB'"></span></p>
                    </div>
                </div>
            </div>
            
            <div class="card-body border-top">
                <!-- Form thêm ảnh -->
                <form th:action="@{/admin/san-pham/bien-the/hinh-anh/save}" method="post" enctype="multipart/form-data" class="mb-4 bg-white p-3 border rounded shadow-sm">
                    <input type="hidden" name="bienTheSanPham.id" th:value="${bienThe.id}" />
                    <h6 class="fw-bold mb-3">Thêm Ảnh từ Máy tính</h6>
                    
                    <div class="row g-2 align-items-end">
                        <div class="col-md-9 mb-2">
                            <label class="form-label small fw-bold">Chọn Ảnh <span class="text-danger">*</span></label>
                            <input type="file" name="file" id="fileInput" class="form-control form-control-sm" accept="image/*" required />
                        </div>
                        <div class="col-md-3 mb-2">
                            <button type="submit" class="btn btn-sm btn-primary w-100">
                                <i class="fa fa-upload"></i> Tải Ảnh Lên
                            </button>
                        </div>
                    </div>
                    
                    <!-- Vùng hiển thị ảnh xem trước -->
                    <div class="mt-3 d-none" id="previewContainer">
                        <p class="small fw-bold mb-1 text-muted">Ảnh xem trước:</p>
                        <img id="imagePreview" src="" alt="Xem trước" class="img-thumbnail" style="max-height: 150px; object-fit: contain;">
                    </div>
                </form>

                <!-- Grid hiển thị ảnh -->
                <!-- Grid hiển thị ảnh -->
                <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
                    <h6 class="fw-bold mb-0">Danh sách Hình Ảnh (Kéo thả để sắp xếp, ảnh đầu tiên là ảnh chính) <span id="savingIndicator" class="ms-2 text-primary d-none"><i class="fa fa-spinner fa-spin"></i> Đang lưu...</span></h6>
                </div>
                <div class="row g-3" id="imageGrid">
                    <div class="col-md-3 col-sm-4 col-6 image-card-container" th:each="anh, iterStat : ${hinhAnhs}" th:attr="data-id=${anh.id}">
                        <div class="card h-100 position-relative shadow-sm" th:classappend="${iterStat.index == 0} ? 'border-primary border-2' : ''">
                            <img th:src="${anh.duongDan}" class="card-img-top p-2" style="height: 150px; object-fit: contain;" alt="Ảnh sản phẩm"
                                 referrerpolicy="no-referrer"
                                 onerror="this.style.display='none';this.nextElementSibling.classList.remove('d-none');">
                            <div class="d-none align-items-center justify-content-center text-muted bg-light" style="height: 150px;">
                                <i class="fa fa-mobile-alt fa-3x opacity-50"></i>
                            </div>
                            
                            <div th:if="${iterStat.index == 0}" class="position-absolute top-0 start-0 badge bg-primary m-1 primary-badge">
                                Ảnh chính
                            </div>
                            <div th:if="${iterStat.index != 0}" class="position-absolute top-0 start-0 badge bg-primary m-1 primary-badge d-none">
                                Ảnh chính
                            </div>

                            <div class="card-footer bg-white p-2 d-flex justify-content-end align-items-center border-top-0">
                                <a th:href="@{/admin/san-pham/bien-the/hinh-anh/delete/{id}(id=${anh.id}, bienTheId=${bienThe.id})}" 
                                   class="text-danger" title="Xóa ảnh"
                                   onclick="event.preventDefault(); pmConfirm('Bạn có chắc muốn xóa ảnh này?').then(ok => { if(ok) window.location.href = this.href; });">
                                    <i class="fa fa-trash"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <div th:if="${#lists.isEmpty(hinhAnhs)}" class="col-12 text-center text-muted py-4 border rounded bg-light no-images-msg">
                        Chưa có hình ảnh nào cho biến thể này.
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const previewContainer = document.getElementById('previewContainer');
            const imagePreview = document.getElementById('imagePreview');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    previewContainer.classList.remove('d-none');
                }
                reader.readAsDataURL(file);
            } else {
                imagePreview.src = "";
                previewContainer.classList.add('d-none');
            }
        });

        // Initialize Sortable
        const imageGrid = document.getElementById('imageGrid');
        if (imageGrid && !imageGrid.querySelector('.no-images-msg')) {
            new Sortable(imageGrid, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    // Update UI immediately for primary image indicator
                    updatePrimaryImageUI();
                    // Auto save order
                    saveOrder();
                }
            });
        }

        function updatePrimaryImageUI() {
            const cards = imageGrid.querySelectorAll('.image-card-container .card');
            cards.forEach((card, index) => {
                const badge = card.querySelector('.primary-badge');
                if (index === 0) {
                    card.classList.add('border-primary', 'border-2');
                    if (badge) badge.classList.remove('d-none');
                } else {
                    card.classList.remove('border-primary', 'border-2');
                    if (badge) badge.classList.add('d-none');
                }
            });
        }

        function saveOrder() {
            const items = imageGrid.querySelectorAll('.image-card-container');
            const ids = Array.from(items).map(item => parseInt(item.getAttribute('data-id')));
            
            const savingIndicator = document.getElementById('savingIndicator');
            if (savingIndicator) savingIndicator.classList.remove('d-none');

            fetch('/admin/san-pham/bien-the/hinh-anh/reorder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(ids)
            })
            .then(res => res.json())
            .then(data => {
                if(!data.success) {
                    pmAlert('Lỗi: ' + data.message, 'error');
                }
            })
            .catch(err => pmAlert('Lỗi kết nối: ' + err, 'error'))
            .finally(() => {
                if (savingIndicator) savingIndicator.classList.add('d-none');
            });
        }
    </script>
</body>
</html>
