<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
    <title th:text="${pageTitle} + ' | PrimeMobile Admin'">Quản lý đánh giá</title>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0 text-gray-800">Quản lý Đánh giá sản phẩm</h1>
        </div>

        <div class="pm-card">
            <div class="pm-card-header">
                Danh sách đánh giá
            </div>
            
            <div class="card-body p-3 bg-light border-bottom">
                <form id="filterForm" class="row g-2 align-items-center" onsubmit="event.preventDefault(); loadReviews(0);">
                    <div class="col-md-3">
                        <input type="text" id="tuKhoa" name="tuKhoa" class="form-control form-control-sm" placeholder="Tìm KH, SP, Nội dung..." />
                    </div>
                    <div class="col-md-2">
                        <select id="trangThai" name="trangThai" class="form-select form-select-sm">
                            <option value="">-- Trạng thái --</option>
                            <option value="cho_duyet">Chờ duyệt</option>
                            <option value="da_duyet">Đã duyệt</option>
                            <option value="an">Đã ẩn</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select id="sao" name="sao" class="form-select form-select-sm">
                            <option value="">-- Số sao --</option>
                            <option value="5">5 sao</option>
                            <option value="4">4 sao</option>
                            <option value="3">3 sao</option>
                            <option value="2">2 sao</option>
                            <option value="1">1 sao</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-sm btn-secondary w-100">Lọc</button>
                    </div>
                </form>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Khách hàng</th>
                                <th>Sản phẩm</th>
                                <th>Số sao</th>
                                <th>Nội dung</th>
                                <th>Ngày tạo</th>
                                <th>Trạng thái</th>
                                <th class="text-end">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="review-table-body">
                            <tr>
                                <td colspan="7" class="text-center py-4">
                                    <i class="fa fa-spinner fa-spin text-muted me-2"></i> Đang tải dữ liệu...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="card-footer bg-white border-top">
                <nav>
                    <ul class="pagination pagination-sm justify-content-end mb-0" id="pagination-container">
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <!-- Modal Xem chi tiết đánh giá -->
    <div class="modal fade" id="reviewDetailModal" tabindex="-1" aria-labelledby="reviewDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="reviewDetailModalLabel">Chi tiết Đánh giá</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="fw-bold text-muted small">Khách hàng</label>
                        <div id="modalKhachHang" class="fw-medium"></div>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold text-muted small">Sản phẩm</label>
                        <div id="modalSanPham" class="fw-medium"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="fw-bold text-muted small">Số sao</label>
                            <div id="modalSao"></div>
                        </div>
                        <div class="col-6">
                            <label class="fw-bold text-muted small">Ngày đánh giá</label>
                            <div id="modalNgayTao" class="fw-medium"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold text-muted small">Tiêu đề</label>
                        <div id="modalTieuDe" class="fw-bold text-primary"></div>
                    </div>
                    <div class="mb-0">
                        <label class="fw-bold text-muted small">Nội dung</label>
                        <div id="modalNoiDung" class="p-3 bg-light rounded border"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>

    <script th:inline="javascript">
        let currentPage = 0;
        let searchTimeout = null;
        let reviewsList = []; // Lưu trữ danh sách đánh giá để dùng cho Modal

        document.getElementById('tuKhoa').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadReviews(0), 400);
        });

        ['trangThai', 'sao'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => loadReviews(0));
        });

        async function loadReviews(page = 0) {
            currentPage = page;
            const tuKhoa = document.getElementById('tuKhoa').value;
            const trangThai = document.getElementById('trangThai').value;
            const sao = document.getElementById('sao').value;

            const params = new URLSearchParams({
                page: page,
                size: 10
            });
            if (tuKhoa) params.append('tuKhoa', tuKhoa);
            if (trangThai) params.append('trangThai', trangThai);
            if (sao) params.append('sao', sao);

            try {
                const res = await fetch(`/api/admin/danh-gia?${params.toString()}`);
                if (!res.ok) throw new Error('Không thể tải danh sách đánh giá');
                const data = await res.json();
                reviewsList = data.content || [];
                
                const tbody = document.getElementById('review-table-body');
                if (!data.content || data.content.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Chưa có đánh giá nào.</td></tr>';
                    document.getElementById('pagination-container').innerHTML = '';
                    return;
                }

                let html = '';
                data.content.forEach(review => {
                    const date = new Date(review.ngayTao).toLocaleDateString('vi-VN');
                    let stars = '';
                    for (let i = 1; i <= 5; i++) {
                        stars += i <= review.sao ? '<i class="fa-solid fa-star star-filled"></i>' : '<i class="fa-regular fa-star star-empty"></i>';
                    }
                    
                    let statusBadge = '';
                    if (review.trangThai === 'cho_duyet') statusBadge = '<span class="badge bg-warning text-white">Chờ duyệt</span>';
                    else if (review.trangThai === 'da_duyet') statusBadge = '<span class="badge bg-success">Đã duyệt</span>';
                    else if (review.trangThai === 'an') statusBadge = '<span class="badge bg-secondary">Đã ẩn</span>';

                    html += `
                        <tr>
                            <td>
                                <strong>${review.khachHang ? review.khachHang.hoTen : 'Unknown'}</strong><br>
                                <small class="text-muted">${review.khachHang ? review.khachHang.email : ''}</small>
                            </td>
                            <td>${review.sanPham ? review.sanPham.tenSanPham : ''}</td>
                            <td>${stars}</td>
                            <td>
                                <strong>${review.tieuDe || '(Không có tiêu đề)'}</strong>
                            </td>
                            <td>${date}</td>
                            <td>${statusBadge}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-info text-white me-1" onclick="viewReviewDetail(${review.id})" title="Xem chi tiết"><i class="fa fa-eye"></i> Xem</button>
                                ${review.trangThai === 'cho_duyet' || review.trangThai === 'an' ? 
                                    `<button class="btn btn-sm btn-success me-1" onclick="approveReview(${review.id})"><i class="fa fa-check"></i> Duyệt</button>` : ''}
                                ${review.trangThai === 'da_duyet' || review.trangThai === 'cho_duyet' ? 
                                    `<button class="btn btn-sm btn-secondary" onclick="hideReview(${review.id})"><i class="fa fa-eye-slash"></i> Ẩn</button>` : ''}
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
                renderPagination(data);
            } catch (err) {
                console.error(err);
                document.getElementById('review-table-body').innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Lỗi tải dữ liệu.</td></tr>';
            }
        }

        function renderPagination(data) {
            const container = document.getElementById('pagination-container');
            if (data.totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            
            // Prev
            html += `<li class="page-item ${data.first ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="event.preventDefault(); loadReviews(${data.number - 1})">Trước</a>
            </li>`;

            // Pages
            for (let i = 0; i < data.totalPages; i++) {
                html += `<li class="page-item ${i === data.number ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="event.preventDefault(); loadReviews(${i})">${i + 1}</a>
                </li>`;
            }

            // Next
            html += `<li class="page-item ${data.last ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="event.preventDefault(); loadReviews(${data.number + 1})">Sau</a>
            </li>`;

            container.innerHTML = html;
        }

        async function approveReview(id) {
            if (!await pmConfirm('Duyệt đánh giá này?')) return;
            try {
                const res = await fetch(`/api/admin/danh-gia/${id}/duyet`, { method: 'PUT' });
                if (!res.ok) throw new Error('Lỗi khi duyệt');
                loadReviews(currentPage);
            } catch (err) {
                pmAlert(err.message, 'error');
            }
        }

        async function hideReview(id) {
            if (!await pmConfirm('Ẩn đánh giá này?')) return;
            try {
                const res = await fetch(`/api/admin/danh-gia/${id}/an`, { method: 'PUT' });
                if (!res.ok) throw new Error('Lỗi khi ẩn');
                loadReviews(currentPage);
            } catch (err) {
                pmAlert(err.message, 'error');
            }
        }

        function viewReviewDetail(id) {
            const review = reviewsList.find(r => r.id === id);
            if (!review) return;
            
            document.getElementById('modalKhachHang').textContent = review.khachHang ? review.khachHang.hoTen + ' (' + review.khachHang.email + ')' : 'Khách ẩn danh';
            
            let sanPhamText = review.sanPham ? review.sanPham.tenSanPham : 'Sản phẩm không xác định';
            if (review.tenBienTheMua) {
                sanPhamText += ' - ' + review.tenBienTheMua;
            }
            document.getElementById('modalSanPham').textContent = sanPhamText;
            
            document.getElementById('modalTieuDe').textContent = review.tieuDe || '(Không có tiêu đề)';
            document.getElementById('modalNoiDung').textContent = review.noiDung || '(Không có nội dung)';
            document.getElementById('modalNgayTao').textContent = new Date(review.ngayTao).toLocaleDateString('vi-VN');
            
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += i <= review.sao ? '<i class="fa-solid fa-star star-filled"></i> ' : '<i class="fa-regular fa-star star-empty"></i> ';
            }
            document.getElementById('modalSao').innerHTML = stars;
            
            const modal = new bootstrap.Modal(document.getElementById('reviewDetailModal'));
            modal.show();
        }

        document.addEventListener('DOMContentLoaded', () => loadReviews(0));
    </script>
</body>
</html>
