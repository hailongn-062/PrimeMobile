<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/admin-layout :: adminHead}"></head>

<body>
    <!-- Sidebar -->
    <div th:replace="~{layout/admin-layout :: sidebar}"></div>

    <!-- Topbar -->
    <div th:replace="~{layout/admin-layout :: topbar}"></div>

    <!-- Main Content -->
    <main id="pmContent">
        <div class="container-fluid mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Danh sách tiếp nhận bảo hành</h2>
                <a href="/admin/bao-hanh/tiep-nhan" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Tiếp nhận máy mới
                </a>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="tblBaoHanh">
                            <thead class="table-light">
                                <tr>
                                    <th>Mã phiếu</th>
                                    <th>Ngày nhận</th>
                                    <th>IMEI</th>
                                    <th>Lỗi (khách báo)</th>
                                    <th>Trung tâm BH</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyBaoHanh">
                                <tr><td colspan="7" class="text-center text-muted">Đang tải...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Phân trang -->
                    <nav class="mt-3">
                        <ul class="pagination justify-content-center" id="pagination"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Chi tiết Phiếu Bảo Hành -->
    <div class="modal fade" id="modalChiTiet" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Chi tiết phiếu bảo hành</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="chiTietContent">
                    <!-- Dynamic content will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nhận lại từ TTBH -->
    <div class="modal fade" id="modalNhanLai" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">Cập nhật nhận lại máy từ TTBH</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="ycNhanLaiId">
                    <div class="mb-3">
                        <label class="form-label">Kết quả xử lý từ TTBH (tuỳ chọn)</label>
                        <textarea class="form-control" id="ketQuaTtbh" rows="3" placeholder="Ví dụ: Đã thay màn hình mới..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-warning" id="btnConfirmNhanLai">Xác nhận đã nhận máy</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <div th:replace="~{layout/admin-layout :: adminScripts}"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const tbody = document.getElementById('tbodyBaoHanh');
            const paginationEl = document.getElementById('pagination');
            let currentList = [];

            // === LOAD DATA ===
            function loadData(page) {
                fetch('/api/admin/bao-hanh/yeu-cau?page=' + page + '&size=10')
                    .then(function (res) {
                        if (!res.ok) throw new Error('Lỗi tải danh sách');
                        return res.json();
                    })
                    .then(function (data) {
                        currentList = data.content;
                        renderTable(data.content);
                        renderPagination(data, page);
                    })
                    .catch(function (err) {
                        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">' + err.message + '</td></tr>';
                    });
            }

            // === RENDER TABLE ===
            function renderTable(list) {
                tbody.innerHTML = '';

                if (!list || list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Chưa có dữ liệu</td></tr>';
                    return;
                }

                list.forEach(function (item, index) {
                    let badgeClass = 'bg-secondary';
                    let statusText = item.trangThai;
                    let actions = '';

                    if (item.trangThai === 'tiep_nhan') {
                        badgeClass = 'bg-info text-dark';
                        statusText = 'Tiếp nhận';
                        actions = '<button class="btn btn-sm btn-primary btn-action" data-id="' + item.id + '" data-action="gui-ttbh">Gửi TTBH</button>';
                    } else if (item.trangThai === 'da_gui_ttbh') {
                        badgeClass = 'bg-warning text-dark';
                        statusText = 'Đã gửi TTBH';
                        actions = '<button class="btn btn-sm btn-dark btn-nhan-lai" data-id="' + item.id + '">Nhận lại</button>';
                    } else if (item.trangThai === 'da_nhan_lai_ttbh') {
                        badgeClass = 'bg-primary';
                        statusText = 'Đã nhận lại';
                        actions = '<button class="btn btn-sm btn-success btn-action" data-id="' + item.id + '" data-action="tra-khach">Trả khách</button>';
                    } else if (item.trangThai === 'da_tra_khach') {
                        badgeClass = 'bg-success';
                        statusText = 'Hoàn thành';
                        actions = '<span class="text-muted">Đã trả khách</span>';
                    }

                    const formattedDate = item.ngayTiepNhan
                        ? new Date(item.ngayTiepNhan).toLocaleDateString('vi-VN')
                        : '';

                    const tr = document.createElement('tr');
                    tr.style.cursor = 'pointer';
                    tr.dataset.index = index;
                    tr.className = 'row-item';

                    tr.innerHTML =
                        '<td><a href="#" class="text-decoration-none fw-bold view-detail" data-index="' + index + '">' + (item.maYeuCau || '') + '</a></td>' +
                        '<td>' + formattedDate + '</td>' +
                        '<td><code>' + (item.imei || '') + '</code></td>' +
                        '<td>' + (item.moTaLoi || '') + '</td>' +
                        '<td>' + (item.tenTrungTam || 'N/A') + '</td>' +
                        '<td><span class="badge ' + badgeClass + '">' + statusText + '</span></td>' +
                        '<td>' + actions + '</td>';
                    tbody.appendChild(tr);
                });
            }

            // === RENDER PAGINATION ===
            function renderPagination(pageData, currentPage) {
                paginationEl.innerHTML = '';
                for (let i = 0; i < pageData.totalPages; i++) {
                    const li = document.createElement('li');
                    li.className = 'page-item' + (i === currentPage ? ' active' : '');
                    const a = document.createElement('a');
                    a.className = 'page-link';
                    a.href = 'javascript:void(0)';
                    a.textContent = i + 1;
                    a.addEventListener('click', function () { loadData(i); });
                    li.appendChild(a);
                    paginationEl.appendChild(li);
                }
            }

            // === EVENT DELEGATION ===
            document.addEventListener('click', function (e) {
                // View Detail
                const btnView = e.target.closest('.view-detail');
                const rowItem = e.target.closest('.row-item');
                
                if (btnView || (rowItem && !e.target.closest('.btn-action') && !e.target.closest('.btn-nhan-lai'))) {
                    e.preventDefault();
                    let index = -1;
                    if (btnView) index = btnView.getAttribute('data-index');
                    else if (rowItem) index = rowItem.getAttribute('data-index');
                    
                    if (index >= 0) {
                        showDetailModal(currentList[index]);
                    }
                }

                // Gửi TTBH / Trả khách
                const btnAction = e.target.closest('.btn-action');
                if (btnAction) {
                    const action = btnAction.getAttribute('data-action');
                    const id = btnAction.getAttribute('data-id');
                    const msg = action === 'gui-ttbh'
                        ? 'Xác nhận đã gửi máy sang TTBH?'
                        : 'Xác nhận đã bàn giao máy cho khách?';
                    if (!confirm(msg)) return;
                    updateStatus(id, action);
                }

                // Nhận lại từ TTBH - mở modal
                const btnNhanLai = e.target.closest('.btn-nhan-lai');
                if (btnNhanLai) {
                    document.getElementById('ycNhanLaiId').value = btnNhanLai.getAttribute('data-id');
                    document.getElementById('ketQuaTtbh').value = '';
                    new bootstrap.Modal(document.getElementById('modalNhanLai')).show();
                }
            });

            function showDetailModal(item) {
                let statusText = item.trangThai;
                if (item.trangThai === 'tiep_nhan') statusText = 'Đang tiếp nhận';
                else if (item.trangThai === 'da_gui_ttbh') statusText = 'Đang gửi trung tâm bảo hành';
                else if (item.trangThai === 'da_nhan_lai_ttbh') statusText = 'Đã nhận lại từ TTBH';
                else if (item.trangThai === 'da_tra_khach') statusText = 'Đã bàn giao cho khách';

                let formattedDate = item.ngayTiepNhan ? new Date(item.ngayTiepNhan).toLocaleDateString('vi-VN') : '';

                let html = `
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small">Phiếu bảo hành</p>
                            <h6 class="fw-bold">${item.maYeuCau || 'N/A'}</h6>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small">Khách hàng</p>
                            <h6 class="fw-bold">${item.tenKhachHang || 'N/A'}<br><small class="text-muted">SĐT: ${item.soDienThoai || 'N/A'}</small></h6>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small">Sản phẩm</p>
                            <h6 class="fw-bold">${item.tenSanPham || 'N/A'}<br><small class="text-muted">${item.tenBienThe || ''}</small></h6>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small">IMEI</p>
                            <h6><code>${item.imei || 'N/A'}</code></h6>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small">Ngày tiếp nhận</p>
                            <h6 class="fw-bold">${formattedDate}</h6>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small">Lỗi khách báo</p>
                            <h6 class="fw-bold">${item.moTaLoi || 'N/A'}</h6>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small">Kiểm tra ban đầu & Tình trạng ngoại quan</p>
                            <h6 class="fw-bold">${item.ghiChu || 'Chưa ghi chú'}</h6>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small">Trung tâm bảo hành</p>
                            <h6 class="fw-bold">${item.tenTrungTam || 'Không gửi TTBH'}</h6>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <p class="mb-1 text-muted small">Trạng thái hiện tại</p>
                            <h6 class="fw-bold text-primary">${statusText}</h6>
                        </div>
                    </div>
                    ${item.ketQuaTtbh ? `
                    <hr>
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <p class="mb-1 text-muted small">Lịch sử xử lý / Kết quả từ TTBH</p>
                            <p class="mb-0 bg-light p-2 border rounded">${item.ketQuaTtbh}</p>
                        </div>
                    </div>` : ''}
                `;
                
                document.getElementById('chiTietContent').innerHTML = html;
                new bootstrap.Modal(document.getElementById('modalChiTiet')).show();
            }

            // Xác nhận nhận lại
            document.getElementById('btnConfirmNhanLai').addEventListener('click', function () {
                const id = document.getElementById('ycNhanLaiId').value;
                const ketQua = document.getElementById('ketQuaTtbh').value;

                fetch('/api/admin/bao-hanh/yeu-cau/' + id + '/nhan-lai', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ketQua: ketQua })
                })
                    .then(function (res) {
                        if (!res.ok) return res.json().then(function (e) { throw new Error(e.message); });
                        bootstrap.Modal.getInstance(document.getElementById('modalNhanLai')).hide();
                        loadData(0);
                        alert('Cập nhật thành công!');
                    })
                    .catch(function (err) { alert('Lỗi: ' + err.message); });
            });

            function updateStatus(id, action) {
                fetch('/api/admin/bao-hanh/yeu-cau/' + id + '/' + action, { method: 'PUT' })
                    .then(function (res) {
                        if (!res.ok) return res.json().then(function (e) { throw new Error(e.message); });
                        loadData(0);
                    })
                    .catch(function (err) { alert('Lỗi: ' + err.message); });
            }

            // Khởi chạy
            loadData(0);
        });
    </script>
</body>
</html>
