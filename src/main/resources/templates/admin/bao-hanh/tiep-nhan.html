<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/admin-layout :: adminHead}"></head>

<body>
    <!-- Sidebar -->
    <div th:replace="~{layout/admin-layout :: sidebar}"></div>

    <!-- Topbar -->
    <div th:replace="~{layout/admin-layout :: topbar}"></div>

    <!-- Main Content -->
    <main id="pmContent">
        <!-- Page Content -->
        <div class="container-fluid mt-4">
            <h2 class="mb-4">Tiếp nhận bảo hành</h2>

            <div class="row">
                <!-- Tra cứu SĐT -->
                <div class="col-md-5">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Tra cứu Phiếu bảo hành (theo SĐT / IMEI)</h5>
                        </div>
                        <div class="card-body">
                            <div class="input-group mb-3 position-relative">
                                <select class="form-select" id="searchType" style="max-width: 130px; flex: none;">
                                    <option value="sdt">Tra theo SĐT</option>
                                    <option value="imei">Tra theo IMEI</option>
                                </select>
                                <input type="text" id="sdtInput" class="form-control" autocomplete="off" placeholder="Nhập SĐT hoặc IMEI...">
                                <button class="btn btn-outline-primary" type="button" id="btnSearch">Tìm kiếm</button>
                                <!-- Custom Bootstrap Dropdown for Suggestions -->
                                <ul class="dropdown-menu w-100 shadow-sm" id="suggestionsDropdown" style="top: 100%; left: 0; margin-top: 2px;"></ul>
                            </div>

                            <div id="searchResult" class="mt-3" style="display: none;">
                                <h6>Các thiết bị đã mua:</h6>
                                <div class="list-group" id="listThietBi">
                                    <!-- Dynamic content -->
                                </div>
                            </div>
                            <div id="searchError" class="alert alert-danger mt-3" style="display: none;">
                            </div>

                            <!-- Bảng thông báo IMEI -->
                            <div id="imeiAlertBox" class="alert alert-warning mt-3" style="display: none;">
                                <h5 class="alert-heading text-danger">⚠️ ĐỐI CHIẾU IMEI</h5>
                                <p>Vui lòng kiểm tra IMEI trên vỏ máy/phần mềm với hệ thống:</p>
                                <h3 class="text-center fw-bold text-dark my-3" id="rsImeiDisplay"></h3>
                                <p class="mb-0 small">Nếu trùng khớp, hãy tiếp tục nhập thông tin lỗi ở cột bên cạnh.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form Yêu cầu -->
                <div class="col-md-7">
                    <div class="card">
                        <div class="card-header bg-success text-white">
                            <h5 class="mb-0">Tạo Yêu cầu sửa chữa</h5>
                        </div>
                        <div class="card-body">
                            <form id="formYeuCau">
                                <input type="hidden" id="formImei">

                                <div class="mb-3">
                                    <label class="form-label">Mô tả lỗi (theo lời khách báo) <span class="text-danger">*</span></label>
                                    <textarea class="form-control" id="moTaLoi" rows="3" required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Trung tâm bảo hành (TTBH) <span class="text-danger">*</span></label>
                                    <select class="form-select" id="ttbhId" required>
                                        <option value="1">Trung tâm bảo hành Chính Hãng Apple</option>
                                        <option value="2">Trung tâm bảo hành Samsung</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Ghi chú thêm</label>
                                    <textarea class="form-control" id="ghiChu" rows="2"></textarea>
                                </div>

                                <button type="button" class="btn btn-success w-100" id="btnSubmit" disabled>Tạo Yêu Cầu</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <div th:replace="~{layout/admin-layout :: adminScripts}"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const btnSearch = document.getElementById('btnSearch');
            const sdtInput = document.getElementById('sdtInput');
            const searchResult = document.getElementById('searchResult');
            const searchError = document.getElementById('searchError');
            const listThietBi = document.getElementById('listThietBi');
            const imeiAlertBox = document.getElementById('imeiAlertBox');
            const rsImeiDisplay = document.getElementById('rsImeiDisplay');
            const formImei = document.getElementById('formImei');
            const btnSubmit = document.getElementById('btnSubmit');
            const suggestionsDropdown = document.getElementById('suggestionsDropdown');
            let suggestTimeout = null;

            // === GỢI Ý TÌM KIẾM (AUTOCOMPLETE CUSTOM) ===
            sdtInput.addEventListener('input', function () {
                const searchType = document.getElementById('searchType').value;
                const searchValue = sdtInput.value.trim();
                
                // Clear suggestions if input is too short
                if ((searchType === 'sdt' && searchValue.length < 2) || 
                    (searchType === 'imei' && searchValue.length < 3)) {
                    suggestionsDropdown.style.display = 'none';
                    suggestionsDropdown.innerHTML = '';
                    return;
                }

                if (suggestTimeout) clearTimeout(suggestTimeout);
                suggestTimeout = setTimeout(() => {
                    fetch('/api/admin/bao-hanh/goi-y?loai=' + searchType + '&tuKhoa=' + encodeURIComponent(searchValue))
                        .then(res => res.json())
                        .then(data => {
                            suggestionsDropdown.innerHTML = '';
                            if (data.length > 0) {
                                data.forEach(item => {
                                    const li = document.createElement('li');
                                    li.innerHTML = `<a class="dropdown-item py-2" href="javascript:void(0)" data-value="${item}">
                                        <i class="fa fa-search text-muted me-2"></i>${item}
                                    </a>`;
                                    suggestionsDropdown.appendChild(li);
                                });
                                suggestionsDropdown.style.display = 'block';
                            } else {
                                suggestionsDropdown.style.display = 'none';
                            }
                        })
                        .catch(err => console.error('Lỗi tải gợi ý:', err));
                }, 300); // 300ms debounce
            });

            // Chọn gợi ý
            suggestionsDropdown.addEventListener('click', function(e) {
                const item = e.target.closest('.dropdown-item');
                if (item) {
                    sdtInput.value = item.getAttribute('data-value');
                    suggestionsDropdown.style.display = 'none';
                    btnSearch.click(); // Tự động click tìm kiếm
                }
            });

            // Đóng menu khi click ra ngoài
            document.addEventListener('click', function(e) {
                if (!sdtInput.contains(e.target) && !suggestionsDropdown.contains(e.target)) {
                    suggestionsDropdown.style.display = 'none';
                }
            });

            // Khi thay đổi loại tìm kiếm thì xóa gợi ý cũ
            document.getElementById('searchType').addEventListener('change', function() {
                sdtInput.value = '';
                suggestionsDropdown.innerHTML = '';
                suggestionsDropdown.style.display = 'none';
                sdtInput.focus();
            });

            // === TRA CỨU SĐT ===
            btnSearch.addEventListener('click', function () {
                const searchType = document.getElementById('searchType').value;
                const searchValue = sdtInput.value.trim();
                if (!searchValue) {
                    alert('Vui lòng nhập giá trị tìm kiếm');
                    return;
                }

                // Reset UI
                searchResult.style.display = 'none';
                searchError.style.display = 'none';
                imeiAlertBox.style.display = 'none';
                btnSubmit.disabled = true;
                formImei.value = '';
                listThietBi.innerHTML = '';

                let url = '/api/admin/bao-hanh/tra-cuu?';
                if (searchType === 'sdt') {
                    url += 'sdt=' + encodeURIComponent(searchValue);
                } else {
                    url += 'imei=' + encodeURIComponent(searchValue);
                }

                fetch(url)
                    .then(function (response) {
                        if (!response.ok) {
                            return response.json().then(function (err) {
                                throw new Error(err.message || 'Lỗi tra cứu SĐT');
                            });
                        }
                        return response.json();
                    })
                    .then(function (res) {
                        if (res.length === 0) {
                            searchError.textContent = 'Không tìm thấy thiết bị nào còn hạn bảo hành cho SĐT này.';
                            searchError.style.display = 'block';
                            return;
                        }

                        res.forEach(function (item) {
                            const div = document.createElement('div');
                            div.className = 'list-group-item list-group-item-action flex-column align-items-start';
                            div.innerHTML =
                                '<div class="d-flex w-100 justify-content-between">' +
                                    '<h6 class="mb-1">' + item.tenSanPham + '</h6>' +
                                    '<small class="text-success fw-bold">Còn hạn</small>' +
                                '</div>' +
                                '<p class="mb-1 text-muted" style="font-size: 0.85em;">' + (item.tenBienThe ? item.tenBienThe : '') + '</p>' +
                                '<p class="mb-1 small">Khách: <strong>' + item.tenKhachHang + '</strong></p>' +
                                '<p class="mb-1 small">Hạn BH: <strong>' + item.ngayHetHan + '</strong></p>' +
                                '<button class="btn btn-sm btn-primary mt-2 btn-chon-may" data-imei="' + item.imei + '">Chọn máy này</button>';
                            listThietBi.appendChild(div);
                        });

                        searchResult.style.display = 'block';
                    })
                    .catch(function (err) {
                        searchError.textContent = err.message || 'Lỗi tra cứu SĐT';
                        searchError.style.display = 'block';
                    });
            });

            // === CHỌN MÁY ===
            document.addEventListener('click', function (e) {
                const btn = e.target.closest('.btn-chon-may');
                if (!btn) return;

                const imei = btn.getAttribute('data-imei');
                rsImeiDisplay.textContent = imei;
                formImei.value = imei;
                imeiAlertBox.style.display = 'block';
                btnSubmit.disabled = false;

                // Highlight item được chọn
                document.querySelectorAll('#listThietBi .list-group-item').forEach(function (el) {
                    el.classList.remove('active');
                });
                btn.closest('.list-group-item').classList.add('active');
            });

            // === TẠO YÊU CẦU ===
            btnSubmit.addEventListener('click', function () {
                const imei = formImei.value;
                if (!imei) return;

                const data = {
                    imei: imei,
                    moTaLoi: document.getElementById('moTaLoi').value,
                    trungTamBaoHanhId: parseInt(document.getElementById('ttbhId').value),
                    ghiChu: document.getElementById('ghiChu').value
                };

                fetch('/api/admin/bao-hanh/yeu-cau', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                    .then(function (response) {
                        if (!response.ok) {
                            return response.json().then(function (err) {
                                throw new Error(err.message || 'Không thể tạo yêu cầu');
                            });
                        }
                        return response.json();
                    })
                    .then(function (res) {
                        alert('Tạo yêu cầu bảo hành thành công! Mã: ' + res.maYeuCau);
                        window.location.href = '/admin/bao-hanh/danh-sach';
                    })
                    .catch(function (err) {
                        alert('Lỗi: ' + err.message);
                    });
            });
        });
    </script>
</body>
</html>
