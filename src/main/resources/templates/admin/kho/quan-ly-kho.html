<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tổng quan Quản lý Kho</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .quick-action-card {
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .quick-action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
        }
        .icon-box {
            width: 65px;
            height: 65px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .table-tk th {
            background-color: #f8f9fa;
        }
        .imei-modal-body {
            max-height: 400px;
            overflow-y: auto;
        }
        .imei-badge {
            font-family: monospace;
            font-size: 0.85rem;
        }
        .imei-status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .imei-status-badge.trong-kho {
            background: #dcfce7;
            color: #166534;
        }
        .imei-status-badge.da-ban {
            background: #fee2e2;
            color: #991b1b;
        }
        .imei-status-badge.bao-hanh {
            background: #fef3c7;
            color: #92400e;
        }
        .imei-status-badge.loi-hong {
            background: #f1f5f9;
            color: #475569;
        }
        .imei-status-badge.unknown {
            background: #f1f5f9;
            color: #64748b;
        }
        .imei-row-hover:hover {
            background-color: #f8fafc;
            cursor: pointer;
        }
    </style>
</head>
<body>
<th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
<th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

<main id="pmContent">
    <div class="container-fluid py-3" style="max-width: 1200px;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold text-primary mb-0">
                <i class="fa fa-boxes me-2"></i> Tổng quan Quản lý Kho
            </h4>
        </div>

        <!-- KHU VỰC 1: BẢNG ĐIỀU KHIỂN (QUICK ACTIONS) -->
        <div class="row g-4 mb-5">
            <!-- Card Phiếu Nhập -->
            <div class="col-md-4">
                <a href="/admin/kho/phieu-nhap" class="card quick-action-card h-100 border-0 shadow-sm bg-white">
                    <div class="card-body d-flex align-items-center p-4">
                        <div class="icon-box bg-success bg-opacity-10 text-success me-4 shadow-sm">
                            <i class="fa fa-download"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-1">Lập Phiếu Nhập Hàng</h5>
                            <p class="text-muted mb-0 small">Nhập hàng từ NCC vào Kho Tổng</p>
                        </div>
                    </div>
                </a>
            </div>



        </div>

        <!-- KHU VỰC 2: BẢNG TRA CỨU TỒN KHO -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom p-4 d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0 text-dark"><i class="fa fa-search me-2 text-info"></i>Tra cứu Tồn Kho</h5>
                <div class="d-flex gap-2">
                    <input type="text" id="searchSku" class="form-control shadow-sm" placeholder="Mã SKU..." style="width: 150px;">
                    <input type="text" id="searchTenSanPham" class="form-control shadow-sm" placeholder="Tên sản phẩm..." style="width: 250px;">
                    <select id="filterKho" class="form-select shadow-sm fw-semibold" style="width: 200px;">
                        <option value="">-- Tất cả kho bãi --</option>
                        <option th:each="kho : ${danhSachKho}"
                                th:value="${kho.id}"
                                th:text="${kho.tenKho}"></option>
                    </select>
                </div>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle table-tk">
                        <thead>
                        <tr>
                            <th style="width: 22%">Kho chứa</th>
                            <th style="width: 18%">Mã SKU</th>
                            <th style="width: 35%">Tên Sản Phẩm</th>
                            <th style="width: 10%" class="text-center">Số lượng tồn</th>
                            <th style="width: 15%" class="text-center">Hành động</th>
                        </tr>
                        </thead>
                        <tbody id="tonKhoBody">
                        <tr><td colspan="5" class="text-center text-muted py-4"><i class="fa fa-spinner fa-spin me-2"></i> Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- ════════════════════════════════════════════════════════════════
     MODAL HIỂN THỊ IMEI
════════════════════════════════════════════════════════════════ -->
<div class="modal fade" id="imeiModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-primary">
                    <i class="fa fa-barcode me-2"></i>Danh sách IMEI
                    <span id="imeiModalSku" class="text-dark ms-2 small">(SKU: --)</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="imeiModalLoading" class="text-center py-4">
                    <i class="fa fa-spinner fa-spin me-2"></i>Đang tải danh sách IMEI...
                </div>
                <div id="imeiModalContent" style="display:none;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted small">Kho: <strong id="imeiModalKho">--</strong></span>
                        <span class="text-muted small">Tổng số: <strong id="imeiModalTotal">0</strong></span>
                    </div>
                    <div class="table-responsive imei-modal-body">
                        <table class="table table-sm table-bordered table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th style="width:50px;">#</th>
                                <th>IMEI 1</th>
                                <th>IMEI 2</th>

                                <th>Trạng thái</th>
                            </tr>
                            </thead>
                            <tbody id="imeiModalTableBody">
                            <!-- Render từ JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const filterKho = document.getElementById("filterKho");
        const searchSku = document.getElementById("searchSku");
        const searchTenSanPham = document.getElementById("searchTenSanPham");
        const tonKhoBody = document.getElementById("tonKhoBody");
        let searchTimeout;

        // ── Hàm load dữ liệu tồn kho ──
        async function loadTonKho() {
            try {
                const khoId = filterKho.value;
                const maSku = searchSku.value;
                const tenSanPham = searchTenSanPham.value;
                
                tonKhoBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4"><i class="fa fa-spinner fa-spin fa-lg me-2"></i> Đang tải dữ liệu tồn kho...</td></tr>';

                const params = new URLSearchParams();
                if (khoId) params.append('khoId', khoId);
                if (maSku) params.append('maSku', maSku);
                if (tenSanPham) params.append('tenSanPham', tenSanPham);

                const url = `/api/admin/kho/ton-kho?${params.toString()}`;
                const response = await fetch(url, { credentials: 'include' });

                if (!response.ok) {
                    throw new Error("Lỗi khi gọi API");
                }

                const list = await response.json();

                if (list.length === 0) {
                    tonKhoBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Chưa có sản phẩm nào trong kho.</td></tr>';
                    return;
                }

                let html = '';
                list.forEach(item => {
                    const isWarning = item.soLuong < 5;
                    const rowClass = isWarning ? 'table-danger' : '';

                    let qtyDisplay;
                    if (isWarning) {
                        qtyDisplay = `<span class="fw-bold text-danger fs-5">${item.soLuong}</span> <br>
                                          <span class="badge bg-danger mt-1"><i class="fa fa-exclamation-triangle me-1"></i>Sắp hết hàng</span>`;
                    } else {
                        qtyDisplay = `<span class="fw-bold text-success fs-5">${item.soLuong}</span>`;
                    }

                    // ⚠️ Cần có bienTheSanPhamId và khoId từ API
                    // Nếu chưa có, tạm thời dùng maSku để tra cứu (không tối ưu)
                    // Khuyến nghị: sửa DTO và controller để trả về các ID này
                    const bienTheId = item.bienTheSanPhamId || 0;
                    const khoIdValue = item.khoId || 0;

                    html += `
                            <tr class="${rowClass} imei-row"
                                data-bien-the-id="${bienTheId}"
                                data-kho-id="${khoIdValue}"
                                data-sku="${item.maSku}"
                                data-ten-kho="${item.tenKho}"
                                style="cursor:pointer;">
                                <td class="fw-semibold">${item.tenKho}</td>
                                <td class="fw-bold text-secondary"><i class="fa fa-tag me-1 small"></i>${item.maSku}</td>
                                <td>${item.tenSanPham}</td>
                                <td class="text-center align-middle">${qtyDisplay}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary btn-xem-imei"
                                            data-bien-the-id="${bienTheId}"
                                            data-kho-id="${khoIdValue}"
                                            data-sku="${item.maSku}"
                                            data-ten-kho="${item.tenKho}"
                                            title="Xem danh sách IMEI">
                                        <i class="fa fa-barcode"></i> IMEI
                                    </button>
                                </td>
                            </tr>
                        `;
                });

                tonKhoBody.innerHTML = html;

            } catch (error) {
                console.error("Lỗi:", error);
                tonKhoBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4"><i class="fa fa-exclamation-triangle me-2"></i> Lỗi mất kết nối tới máy chủ!</td></tr>';
            }
        }

        // ── Hàm mở modal IMEI ──
        async function openImeiModal(bienTheId, khoId, sku, tenKho) {
            const loading = document.getElementById('imeiModalLoading');
            const content = document.getElementById('imeiModalContent');
            const tableBody = document.getElementById('imeiModalTableBody');

            document.getElementById('imeiModalSku').textContent = `(SKU: ${sku})`;
            document.getElementById('imeiModalKho').textContent = tenKho || '--';

            loading.style.display = 'block';
            content.style.display = 'none';
            tableBody.innerHTML = '';

            const modal = new bootstrap.Modal(document.getElementById('imeiModal'));
            modal.show();

            try {
                // Gọi API lấy danh sách IMEI
                const url = `/api/admin/imei/danh-sach?bienTheSanPhamId=${bienTheId}&khoId=${khoId}`;
                const response = await fetch(url, { credentials: 'include' });
                if (!response.ok) {
                    throw new Error('Không thể tải danh sách IMEI');
                }
                const imeiList = await response.json();

                loading.style.display = 'none';
                content.style.display = 'block';

                if (!imeiList || imeiList.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">Không có IMEI nào trong kho này.</td></tr>`;
                    document.getElementById('imeiModalTotal').textContent = '0';
                    return;
                }

                document.getElementById('imeiModalTotal').textContent = imeiList.length;

                let html = '';
                imeiList.forEach((imei, index) => {
                    const statusClass = imei.tinhTrang || 'unknown';
                    const statusLabel = {
                        'trong_kho': 'Trong kho',
                        'da_ban': 'Đã bán',
                        'dang_giu': 'Đang giữ',
                        'bao_hanh': 'Bảo hành',
                        'loi_hong': 'Lỗi hỏng'
                    }[statusClass] || statusClass;

                    html += `
                            <tr>
                                <td class="text-muted text-center">${index + 1}</td>
                                <td class="fw-semibold imei-badge">${imei.imei1}</td>
                                <td class="fw-semibold imei-badge">${imei.imei2 || '—'}</td>

                                <td><span class="imei-status-badge ${statusClass}">${statusLabel}</span></td>
                            </tr>
                        `;
                });
                tableBody.innerHTML = html;

            } catch (error) {
                loading.innerHTML = `<div class="text-danger">${error.message || 'Không thể tải dữ liệu IMEI.'}</div>`;
            }
        }

        // ── Sự kiện click trên nút "Xem IMEI" ──
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.btn-xem-imei');
            if (btn) {
                e.stopPropagation();
                const bienTheId = btn.dataset.bienTheId;
                const khoId = btn.dataset.khoId;
                const sku = btn.dataset.sku;
                const tenKho = btn.dataset.tenKho;
                if (bienTheId && khoId) {
                    openImeiModal(bienTheId, khoId, sku, tenKho);
                } else {
                    pmAlert('Không tìm thấy ID của biến thể hoặc kho. Vui lòng cập nhật dữ liệu từ API.', 'warning');
                }
            }
        });

        // ── Sự kiện click trên cả dòng (có thể mở modal) ──
        document.addEventListener('click', function(e) {
            const row = e.target.closest('.imei-row');
            if (row && !e.target.closest('.btn-xem-imei')) {
                const bienTheId = row.dataset.bienTheId;
                const khoId = row.dataset.khoId;
                const sku = row.dataset.sku;
                const tenKho = row.dataset.tenKho;
                if (bienTheId && khoId) {
                    openImeiModal(bienTheId, khoId, sku, tenKho);
                }
            }
        });

        // ── Load dữ liệu ban đầu ──
        loadTonKho();

        // ── Lọc theo kho ──
        filterKho.addEventListener("change", function() {
            loadTonKho();
        });

        // ── Tìm kiếm với debounce ──
        ['searchSku', 'searchTenSanPham'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => loadTonKho(), 400);
            });
        });
    });
</script>
</body>
</html>
