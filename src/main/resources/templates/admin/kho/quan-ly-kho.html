<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tổng quan Quản lý Kho</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .quick-action-card {
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .quick-action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
        }
        .icon-box {
            width: 65px;
            height: 65px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .table-tk th {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="container-fluid py-3" style="max-width: 1200px;">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold text-primary mb-0">
                    <i class="fa fa-boxes me-2"></i> Tổng quan Quản lý Kho
                </h4>
            </div>

            <!-- KHU VỰC 1: BẢNG ĐIỀU KHIỂN (QUICK ACTIONS) -->
            <div class="row g-4 mb-5">
                <!-- Card Phiếu Nhập -->
                <div class="col-md-4">
                    <a href="/admin/kho/phieu-nhap" class="card quick-action-card h-100 border-0 shadow-sm bg-white">
                        <div class="card-body d-flex align-items-center p-4">
                            <div class="icon-box bg-success bg-opacity-10 text-success me-4 shadow-sm">
                                <i class="fa fa-download"></i>
                            </div>
                            <div>
                                <h5 class="fw-bold mb-1">Lập Phiếu Nhập Hàng</h5>
                                <p class="text-muted mb-0 small">Nhập hàng từ NCC vào Kho Tổng</p>
                            </div>
                        </div>
                    </a>
                </div>
                
                <!-- Card Phiếu Chuyển -->
                <div class="col-md-4">
                    <a href="/admin/kho/phieu-chuyen" class="card quick-action-card h-100 border-0 shadow-sm bg-white">
                        <div class="card-body d-flex align-items-center p-4">
                            <div class="icon-box bg-warning bg-opacity-10 text-warning me-4 shadow-sm">
                                <i class="fa fa-exchange-alt"></i>
                            </div>
                            <div>
                                <h5 class="fw-bold mb-1">Luân Chuyển Kho</h5>
                                <p class="text-muted mb-0 small">Phân bổ hàng hóa giữa các kho</p>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Card Kiểm soát IMEI -->
                <div class="col-md-4">
                    <a href="/admin/kho/kiem-soat-imei" class="card quick-action-card h-100 border-0 shadow-sm bg-white">
                        <div class="card-body d-flex align-items-center p-4">
                            <div class="icon-box bg-primary bg-opacity-10 text-primary me-4 shadow-sm">
                                <i class="fa fa-barcode"></i>
                            </div>
                            <div>
                                <h5 class="fw-bold mb-1">Kiểm Soát Mã IMEI</h5>
                                <p class="text-muted mb-0 small">Định danh IMEI nhập kho</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- KHU VỰC 2: BẢNG TRA CỨU TỒN KHO -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom p-4 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-dark"><i class="fa fa-search me-2 text-info"></i>Tra cứu Tồn Kho</h5>
                    <div style="width: 300px;">
                        <select id="filterKho" class="form-select shadow-sm fw-semibold">
                            <option value="">-- Tất cả kho bãi --</option>
                            <option th:each="kho : ${danhSachKho}" 
                                    th:value="${kho.id}" 
                                    th:text="${kho.tenKho}"></option>
                        </select>
                    </div>
                </div>
                <div class="card-body p-4">
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle table-tk">
                            <thead>
                                <tr>
                                    <th style="width: 25%">Kho chứa</th>
                                    <th style="width: 20%">Mã SKU</th>
                                    <th style="width: 40%">Tên Sản Phẩm</th>
                                    <th style="width: 15%" class="text-center">Số lượng tồn</th>
                                </tr>
                            </thead>
                            <tbody id="tonKhoBody">
                                <tr><td colspan="4" class="text-center text-muted py-4"><i class="fa fa-spinner fa-spin me-2"></i> Đang tải dữ liệu...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const filterKho = document.getElementById("filterKho");
            const tonKhoBody = document.getElementById("tonKhoBody");

            // Hàm load dữ liệu qua Fetch API
            async function loadTonKho(khoId = '') {
                try {
                    // Trạng thái Loading
                    tonKhoBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4"><i class="fa fa-spinner fa-spin fa-lg me-2"></i> Đang tải dữ liệu tồn kho...</td></tr>';
                    
                    const url = khoId ? `/api/admin/kho/ton-kho?khoId=${khoId}` : `/api/admin/kho/ton-kho`;
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error("Lỗi khi gọi API");
                    }
                    
                    const list = await response.json();
                    
                    // Render danh sách
                    if (list.length === 0) {
                        tonKhoBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Chưa có sản phẩm nào trong kho.</td></tr>';
                        return;
                    }

                    let html = '';
                    list.forEach(item => {
                        const isWarning = item.soLuong < 5; // Safety Stock
                        const rowClass = isWarning ? 'table-danger' : '';
                        
                        let qtyDisplay;
                        if (isWarning) {
                            qtyDisplay = `<span class="fw-bold text-danger fs-5">${item.soLuong}</span> <br>
                                          <span class="badge bg-danger mt-1"><i class="fa fa-exclamation-triangle me-1"></i>Sắp hết hàng</span>`;
                        } else {
                            qtyDisplay = `<span class="fw-bold text-success fs-5">${item.soLuong}</span>`;
                        }

                        html += `
                            <tr class="${rowClass}">
                                <td class="fw-semibold">${item.tenKho}</td>
                                <td class="fw-bold text-secondary"><i class="fa fa-tag me-1 small"></i>${item.maSku}</td>
                                <td>${item.tenSanPham}</td>
                                <td class="text-center align-middle">${qtyDisplay}</td>
                            </tr>
                        `;
                    });
                    
                    tonKhoBody.innerHTML = html;

                } catch (error) {
                    console.error("Lỗi:", error);
                    tonKhoBody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4"><i class="fa fa-exclamation-triangle me-2"></i> Lỗi mất kết nối tới máy chủ!</td></tr>';
                }
            }

            // Lần load trang đầu tiên
            loadTonKho();

            // Lắng nghe sự kiện thay đổi Kho ở Dropdown
            filterKho.addEventListener("change", function() {
                loadTonKho(this.value);
            });
        });
    </script>
</body>
</html>
