<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Nhà Cung Cấp - PrimeMobile</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="pm-card">
            <div class="pm-card-header">
                Danh sách Nhà Cung Cấp
                <a href="/admin/nha-cung-cap/form" class="btn btn-primary btn-sm">
                    <i class="fa fa-plus"></i> Thêm mới
                </a>
            </div>
            
            <div class="card-body p-3 bg-light border-bottom">
                <form method="get" action="/admin/nha-cung-cap" class="row g-2 align-items-center">
                    <div class="col-md-5">
                        <input type="text" name="tuKhoa" th:value="${tuKhoa}" class="form-control form-control-sm" placeholder="Tìm theo Mã, Tên, SĐT, Email..." />
                    </div>
                    <div class="col-md-3">
                        <select name="trangThai" class="form-select form-select-sm">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option value="dang_hop_tac" th:selected="${trangThai == 'dang_hop_tac'}">Đang hợp tác</option>
                            <option value="ngung_hop_tac" th:selected="${trangThai == 'ngung_hop_tac'}">Ngừng hợp tác</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-sm btn-secondary">
                            <i class="fa fa-search"></i> Tìm kiếm
                        </button>
                        <a href="/admin/nha-cung-cap" class="btn btn-sm btn-outline-secondary ms-1">
                            <i class="fa fa-sync-alt"></i> Làm mới
                        </a>
                    </div>
                </form>
            </div>

            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Mã NCC</th>
                            <th>Tên Nhà Cung Cấp</th>
                            <th>Liên hệ</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ncc : ${nccPage.content}">
                            <td class="fw-bold text-primary" th:text="${ncc.maNcc}"></td>
                            <td class="fw-bold" th:text="${ncc.tenNcc}"></td>
                            <td>
                                <div><i class="fa fa-user text-muted small"></i> <span th:text="${ncc.nguoiLienHe ?: '---'}"></span></div>
                                <div><i class="fa fa-phone text-muted small"></i> <span th:text="${ncc.soDienThoai ?: '---'}"></span></div>
                            </td>
                            <td>
                                <span th:if="${ncc.trangThai == 'dang_hop_tac'}" class="badge bg-success">Đang hợp tác</span>
                                <span th:if="${ncc.trangThai == 'ngung_hop_tac'}" class="badge bg-secondary">Ngừng hợp tác</span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/nha-cung-cap/toggle-status/{id}(id=${ncc.id})}" 
                                   class="btn btn-sm" th:classappend="${ncc.trangThai == 'dang_hop_tac' ? 'btn-outline-secondary' : 'btn-outline-success'}"
                                   title="Đổi trạng thái">
                                    <i th:class="${ncc.trangThai == 'dang_hop_tac' ? 'fa fa-ban' : 'fa fa-check'}"></i>
                                </a>
                                <a th:href="@{/admin/nha-cung-cap/form(id=${ncc.id})}" class="btn btn-sm btn-outline-primary ms-1" title="Sửa">
                                    <i class="fa fa-edit"></i> Sửa
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(nccPage.content)}">
                            <td colspan="5" class="text-center py-4 text-muted">Không tìm thấy nhà cung cấp nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Phân trang -->
            <div class="card-footer" th:if="${nccPage.totalPages > 1}">
                <ul class="pagination pagination-sm mb-0 justify-content-end">
                    <li class="page-item" th:classappend="${nccPage.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/nha-cung-cap(page=${nccPage.number - 1}, tuKhoa=${tuKhoa}, trangThai=${trangThai})}">Trước</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="${'Trang ' + (nccPage.number + 1) + ' / ' + nccPage.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${nccPage.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/nha-cung-cap(page=${nccPage.number + 1}, tuKhoa=${tuKhoa}, trangThai=${trangThai})}">Sau</a>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
