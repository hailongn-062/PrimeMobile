<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle} + ' - PrimeMobile'">Thêm Sửa Nhà Cung Cấp</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="pm-card" style="max-width: 600px; margin: 0 auto;">
            <div class="pm-card-header" th:text="${pageTitle}">
                Thêm/Sửa Nhà Cung Cấp
            </div>
            <div class="card-body p-4">
                <form th:action="@{/admin/nha-cung-cap/save}" th:object="${nhaCungCap}" method="post">
                    <!-- ID (hidden) -->
                    <input type="hidden" th:field="*{id}" />

                    <!-- Mã NCC -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mã Nhà Cung Cấp <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{maNcc}" th:readonly="*{id != null}" placeholder="VD: NCC-001 (Bắt buộc)" required />
                        <div class="form-text" th:if="*{id == null}">Mã nhà cung cấp không được trùng lặp.</div>
                    </div>

                    <!-- Tên NCC -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên Nhà Cung Cấp <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{tenNcc}" required placeholder="VD: Công ty TNHH Apple Việt Nam" />
                    </div>

                    <!-- Người liên hệ -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Người liên hệ</label>
                        <input type="text" class="form-control" th:field="*{nguoiLienHe}" placeholder="Tên đầu mối liên hệ" />
                    </div>
                    
                    <div class="row">
                        <!-- Số điện thoại -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Số điện thoại</label>
                            <input type="text" class="form-control" th:field="*{soDienThoai}" placeholder="VD: 0912345678" />
                        </div>

                        <!-- Email -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="VD: lienhe@apple.vn" />
                        </div>
                    </div>

                    <!-- Địa chỉ -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Địa chỉ</label>
                        <textarea class="form-control" th:field="*{diaChi}" rows="3" placeholder="Số nhà, đường, quận, thành phố..."></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/admin/nha-cung-cap}" class="btn btn-light">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa fa-save"></i> Lưu dữ liệu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
