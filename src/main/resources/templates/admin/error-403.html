<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/admin-layout :: adminHead}">
    <title>Không có quyền truy cập | PrimeMobile Admin</title>
</head>
<body>

<div th:replace="~{layout/admin-layout :: sidebar}"></div>
<div th:replace="~{layout/admin-layout :: topbar}"></div>

<main id="pmContent">
    <div class="d-flex flex-column align-items-center justify-content-center text-center"
         style="min-height: 70vh;">

        <!-- Icon 403 -->
        <div style="font-size: 5rem; line-height: 1; margin-bottom: 1rem;">🚫</div>

        <h1 class="fw-bold mb-2" style="font-size: 3rem; color: #EF4444;">403</h1>
        <h2 class="fw-semibold mb-3" style="font-size: 1.3rem;">Không có quyền truy cập</h2>
        <p class="text-muted mb-1" style="max-width: 480px; font-size: .92rem;">
            Chức năng <strong>Quản lý Nhân Viên</strong> chỉ dành riêng cho
            tài khoản <span class="badge bg-danger rounded-pill px-3">Admin</span>.
        </p>
        <p class="text-muted mb-4" style="font-size:.85rem;">
            Tài khoản của bạn (<strong th:text="${currentUser != null ? currentUser.getRole() : 'Không xác định'}">NhanVien</strong>)
            không được phép thực hiện thao tác này.
        </p>

        <a href="/admin/dashboard" class="btn btn-pm-primary rounded-pill px-5 py-2">
            <i class="fa fa-arrow-left me-2"></i>Về trang tổng quan
        </a>
    </div>
</main>

<div th:replace="~{layout/admin-layout :: adminScripts}"></div>
</body>
</html>
