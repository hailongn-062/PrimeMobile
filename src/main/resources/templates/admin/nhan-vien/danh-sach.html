<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Nhân Viên - PrimeMobile</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fa fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="pm-card">
            <div class="pm-card-header">
                Danh sách Nhân Viên
                <a href="/admin/nhan-vien/form" class="btn btn-primary btn-sm">
                    <i class="fa fa-user-plus"></i> Thêm Nhân Viên
                </a>
            </div>

            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Họ Tên</th>
                            <th>Email</th>
                            <th>Số điện thoại</th>
                            <th>Đăng nhập cuối</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="nv : ${danhSachNhanVien}">
                            <td class="fw-bold" th:text="${nv.hoTen}"></td>
                            <td th:text="${nv.email}"></td>
                            <td th:text="${nv.soDienThoai ?: '---'}"></td>
                            <td th:text="${nv.lanDangNhapCuoi != null ? #temporals.format(nv.lanDangNhapCuoi, 'dd/MM/yyyy HH:mm') : 'Chưa đăng nhập'}"></td>
                            <td>
                                <span th:if="${nv.trangThai == 'hoat_dong'}" class="badge bg-success">Hoạt động</span>
                                <span th:if="${nv.trangThai == 'khoa'}" class="badge bg-danger">Bị khóa</span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/nhan-vien/toggle-status/{id}(id=${nv.id})}" 
                                   class="btn btn-sm" th:classappend="${nv.trangThai == 'hoat_dong' ? 'btn-warning' : 'btn-success'}"
                                   th:title="${nv.trangThai == 'hoat_dong' ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
                                    <i th:class="${nv.trangThai == 'hoat_dong' ? 'fa fa-lock' : 'fa fa-unlock'}"></i>
                                </a>
                                <a th:href="@{/admin/nhan-vien/form(id=${nv.id})}" class="btn btn-sm btn-outline-primary ms-1" title="Sửa">
                                    <i class="fa fa-edit"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(danhSachNhanVien)}">
                            <td colspan="6" class="text-center py-4 text-muted">Chưa có nhân viên nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
