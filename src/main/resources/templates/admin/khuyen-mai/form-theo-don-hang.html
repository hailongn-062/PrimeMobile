<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle} + ' - PrimeMobile'">KM Theo Đơn Hàng</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="pm-card" style="max-width: 700px; margin: 0 auto;">
            <div class="pm-card-header">
                <i class="fa fa-shopping-cart me-2 text-success"></i>
                <span th:text="${pageTitle}">KM Theo Đơn Hàng</span>
            </div>
            <div class="card-body p-4">

                <div th:if="${errorMessage}" class="alert alert-danger p-2 mb-3 small" th:text="${errorMessage}"></div>

                <form th:action="@{/admin/khuyen-mai/save}" th:object="${ctkm}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" name="loai" value="theo_don_hang" />

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên chương trình <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{tenCtkm}" required
                               placeholder="VD: Giảm 10% đơn từ 5 triệu" />
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phần trăm giảm (%) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" class="form-control" th:field="*{giaTriUuDai}" data-pct-input="true"
                                       required min="0.01" max="100" step="0.01" placeholder="VD: 10" />
                                <span class="input-group-text">%</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Đơn hàng tối thiểu (đ)</label>
                            <div class="input-group">
                                <input type="text" inputmode="numeric" data-price-input="true" class="form-control" th:field="*{donHangToiThieu}"
                                       placeholder="VD: 5000000" />
                                <span class="input-group-text">đ</span>
                            </div>
                        </div>
                        <div class="col-md-6 mt-3">
                            <label class="form-label fw-semibold">Giảm tối đa (đ)</label>
                            <div class="input-group">
                                <input type="text" inputmode="numeric" data-price-input="true" class="form-control" th:field="*{giamToiDa}"
                                       placeholder="Để trống = không giới hạn" />
                                <span class="input-group-text">đ</span>
                            </div>
                            <div class="form-text">Để trống nếu không giới hạn mức giảm.</div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày bắt đầu <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" th:field="*{ngayBatDau}" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày kết thúc <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" th:field="*{ngayKetThuc}" required />
                        </div>
                    </div>



                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mô tả</label>
                        <textarea class="form-control" th:field="*{moTa}" rows="2"
                                  placeholder="Mô tả chi tiết chương trình..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                        <a href="/admin/khuyen-mai" class="btn btn-light">
                            <i class="fa fa-arrow-left me-1"></i> Hủy
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fa fa-save me-1"></i> Lưu Khuyến Mãi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
