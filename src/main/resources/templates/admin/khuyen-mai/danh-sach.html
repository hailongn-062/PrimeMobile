<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Khuyến Mãi - PrimeMobile</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <i class="fa fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <i class="fa fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="pm-card">
            <div class="pm-card-header">
                Danh sách Chương trình Khuyến Mãi
                <a href="/admin/khuyen-mai/form" class="btn btn-primary btn-sm">
                    <i class="fa fa-plus"></i> Thêm mới
                </a>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tên Chương trình</th>
                            <th>Loại</th>
                            <th>Giá trị ưu đãi</th>
                            <th>Thời gian</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ctkm : ${ctkmList}">
                            <td class="fw-bold" th:text="${ctkm.tenCtkm}"></td>
                            <td>
                                <th:block th:switch="${ctkm.loai}">
                                    <span th:case="'ma_code'" class="badge bg-info text-dark"><i class="fa fa-ticket-alt"></i> Mã giảm giá</span>
                                    <span th:case="'flash_sale'" class="badge bg-danger"><i class="fa fa-bolt"></i> Flash Sale</span>
                                    <span th:case="'giam_gia_truc_tiep'" class="badge bg-warning text-dark">Giảm trực tiếp</span>
                                    <span th:case="'phan_tram'" class="badge bg-warning text-dark">Phần trăm</span>
                                    <span th:case="'don_hang_toi_thieu'" class="badge bg-secondary">Đơn tối thiểu</span>
                                    <span th:case="*" class="badge bg-secondary" th:text="${ctkm.loai}"></span>
                                </th:block>
                            </td>
                            <td>
                                <span th:if="${ctkm.laPhanTram}" th:text="${ctkm.giaTriUuDai} + '%'"></span>
                                <span th:if="${!ctkm.laPhanTram}" th:text="${#numbers.formatDecimal(ctkm.giaTriUuDai ?: 0, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </td>
                            <td class="small text-muted">
                                <div>Từ: <span th:text="${#temporals.format(ctkm.ngayBatDau, 'dd/MM/yyyy')}"></span></div>
                                <div>Đến: <span th:text="${#temporals.format(ctkm.ngayKetThuc, 'dd/MM/yyyy')}"></span></div>
                            </td>
                            <td>
                                <th:block th:switch="${ctkm.trangThai}">
                                    <span th:case="'chua_bat_dau'" class="badge bg-secondary">Chưa bắt đầu</span>
                                    <span th:case="'dang_dien_ra'" class="badge bg-success">Đang diễn ra</span>
                                    <span th:case="'da_ket_thuc'" class="badge bg-dark">Đã kết thúc</span>
                                    <span th:case="'tam_dung'" class="badge bg-warning text-dark">Tạm dừng</span>
                                </th:block>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/khuyen-mai/{id}/chi-tiet(id=${ctkm.id})}" class="btn btn-sm btn-outline-info" title="Chi tiết">
                                    <i class="fa fa-list"></i> Chi tiết
                                </a>
                                <a th:href="@{/admin/khuyen-mai/form(id=${ctkm.id})}" class="btn btn-sm btn-outline-primary ms-1" title="Sửa">
                                    <i class="fa fa-edit"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ctkmList)}">
                            <td colspan="6" class="text-center py-4 text-muted">Chưa có chương trình khuyến mãi nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
