<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle} + ' - PrimeMobile'">Chi tiết KM Theo Đơn Hàng</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <!-- Flash Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
            <i class="fa fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
            <i class="fa fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Breadcrumb -->
        <div class="mb-3 d-flex gap-2">
            <a href="/admin/khuyen-mai" class="btn btn-sm btn-outline-secondary">
                <i class="fa fa-arrow-left me-1"></i> Danh sách
            </a>
            <a th:href="${formUrl}" class="btn btn-sm btn-outline-primary">
                <i class="fa fa-edit me-1"></i> Sửa thông tin chung
            </a>
            
            <a th:if="${ctkm.trangThai == 'tam_dung'}"
               th:href="@{/admin/khuyen-mai/toggle-trang-thai/{id}(id=${ctkm.id})}"
               class="btn btn-sm btn-success"
               title="Mở lại chương trình"
               onclick="event.preventDefault(); pmConfirm('Mở lại chương trình này?').then(ok => { if(ok) window.location.href = this.href; });">
                <i class="fa fa-play me-1"></i> Mở lại
            </a>
            <a th:unless="${ctkm.trangThai == 'tam_dung'}"
               th:href="@{/admin/khuyen-mai/toggle-trang-thai/{id}(id=${ctkm.id})}"
               class="btn btn-sm btn-warning text-white"
               title="Tạm dừng chương trình"
               onclick="event.preventDefault(); pmConfirm('Tạm dừng chương trình này?').then(ok => { if(ok) window.location.href = this.href; });">
                <i class="fa fa-pause me-1"></i> Tạm dừng
            </a>
        </div>

        <div class="pm-card mb-4">
            <div class="pm-card-header d-flex justify-content-between align-items-center">
                <span>
                    <i class="fa fa-shopping-cart me-2 text-success"></i>
                    <span th:text="${ctkm.tenCtkm}">Tên CTKM</span>
                </span>
                <th:block th:switch="${ctkm.trangThai}">
                    <span th:case="'chua_bat_dau'" class="badge bg-secondary fs-6">Chưa bắt đầu</span>
                    <span th:case="'dang_dien_ra'" class="badge bg-success fs-6">Đang diễn ra</span>
                    <span th:case="'da_ket_thuc'" class="badge bg-dark fs-6">Đã kết thúc</span>
                    <span th:case="'tam_dung'" class="badge bg-warning text-white fs-6">Tạm dừng</span>
                </th:block>
            </div>
            <div class="card-body p-3 p-lg-4 text-center">
                <div class="row g-3 justify-content-center">
                    <div class="col-md-4">
                        <p class="mb-1 text-muted small">Loại KM</p>
                        <strong class="text-success"><i class="fa fa-shopping-cart me-1"></i> Theo đơn hàng</strong>
                    </div>
                    <div class="col-md-4">
                        <p class="mb-1 text-muted small">Giảm (%)</p>
                        <strong class="text-danger fs-5" th:text="${ctkm.giaTriUuDai + '%'}"></strong>
                    </div>
                    <div class="col-md-4" th:if="${ctkm.giamToiDa != null}">
                        <p class="mb-1 text-muted small">Giảm tối đa</p>
                        <strong class="text-warning" th:text="${#numbers.formatDecimal(ctkm.giamToiDa, 0, 'COMMA', 0, 'POINT')} + 'đ'"></strong>
                    </div>
                </div>
                <div class="row g-3 mt-1 justify-content-center">
                    <div class="col-md-6">
                        <p class="mb-1 text-muted small">Bắt đầu</p>
                        <strong th:text="${#temporals.format(ctkm.ngayBatDau, 'dd/MM/yyyy HH:mm')}"></strong>
                    </div>
                    <div class="col-md-6">
                        <p class="mb-1 text-muted small">Kết thúc</p>
                        <strong th:text="${#temporals.format(ctkm.ngayKetThuc, 'dd/MM/yyyy HH:mm')}"></strong>
                    </div>
                </div>
                <div class="row g-3 mt-1 justify-content-center">
                    <div class="col-md-12">
                        <p class="mb-1 text-muted small">Điều kiện áp dụng</p>
                        <strong th:if="${ctkm.donHangToiThieu != null}">
                            Đơn hàng từ <span class="text-primary" th:text="${#numbers.formatDecimal(ctkm.donHangToiThieu, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                        </strong>
                        <strong th:if="${ctkm.donHangToiThieu == null}" class="text-success">Không yêu cầu tối thiểu</strong>
                    </div>
                </div>
                <p class="mt-3 mb-0 text-muted small" th:if="${ctkm.moTa != null}" th:text="${ctkm.moTa}"></p>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
