<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle} + ' - PrimeMobile'">Chi tiết KM Theo Sản Phẩm</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <!-- Flash Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
            <i class="fa fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
            <i class="fa fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Breadcrumb -->
        <div class="mb-3 d-flex gap-2">
            <a href="/admin/khuyen-mai" class="btn btn-sm btn-outline-secondary">
                <i class="fa fa-arrow-left me-1"></i> Danh sách
            </a>
            <a th:href="${formUrl}" class="btn btn-sm btn-outline-primary">
                <i class="fa fa-edit me-1"></i> Sửa thông tin chung
            </a>
        </div>

        <!-- NỬA TRÊN: Tóm tắt -->
        <div class="pm-card mb-4">
            <div class="pm-card-header d-flex justify-content-between align-items-center">
                <span>
                    <i class="fa fa-cube me-2 text-primary"></i>
                    <span th:text="${ctkm.tenCtkm}">Tên CTKM</span>
                </span>
                <th:block th:switch="${ctkm.trangThai}">
                    <span th:case="'chua_bat_dau'" class="badge bg-secondary fs-6">Chưa bắt đầu</span>
                    <span th:case="'dang_dien_ra'" class="badge bg-success fs-6">Đang diễn ra</span>
                    <span th:case="'da_ket_thuc'" class="badge bg-dark fs-6">Đã kết thúc</span>
                    <span th:case="'tam_dung'" class="badge bg-warning text-dark fs-6">Tạm dừng</span>
                </th:block>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <p class="mb-1 text-muted small">Loại KM</p>
                        <strong class="text-primary"><i class="fa fa-cube me-1"></i> Theo sản phẩm</strong>
                    </div>
                    <div class="col-md-3">
                        <p class="mb-1 text-muted small">Giảm (%)</p>
                        <strong class="text-danger fs-5" th:text="${ctkm.giaTriUuDai + '%'}"></strong>

                    </div>
                    <div class="col-md-3">
                        <p class="mb-1 text-muted small">Bắt đầu</p>
                        <strong th:text="${#temporals.format(ctkm.ngayBatDau, 'dd/MM/yyyy HH:mm')}"></strong>
                    </div>
                    <div class="col-md-3">
                        <p class="mb-1 text-muted small">Kết thúc</p>
                        <strong th:text="${#temporals.format(ctkm.ngayKetThuc, 'dd/MM/yyyy HH:mm')}"></strong>
                    </div>
                </div>
                <p class="mt-3 mb-0 text-muted small" th:if="${ctkm.moTa != null}" th:text="${ctkm.moTa}"></p>
            </div>
        </div>

        <!-- NỬA DƯỚI: Quản lý Phạm vi Sản phẩm -->
        <div class="pm-card">
            <div class="pm-card-header">
                <i class="fa fa-boxes me-2"></i> Sản phẩm áp dụng
                <span class="badge bg-primary ms-2" th:text="${#lists.size(phamViList)}"></span>
            </div>
            <div class="card-body">

                <!-- Form thêm sản phẩm -->
                <form th:action="@{/admin/khuyen-mai/{id}/pham-vi/them(id=${ctkm.id})}"
                      method="post" class="bg-light border rounded p-3 mb-4">
                    <h6 class="fw-semibold mb-3"><i class="fa fa-plus-circle text-primary me-1"></i> Thêm sản phẩm áp dụng</h6>
                    <div class="row g-2 align-items-end">
                        <div class="col-md-8">
                            <label class="form-label small fw-semibold">Chọn sản phẩm <span class="text-danger">*</span></label>
                            <select name="sanPhamId" class="form-select form-select-sm" required>
                                <option value="">-- Chọn sản phẩm --</option>
                                <option th:each="sp : ${danhSachSanPham}"
                                        th:value="${sp.id}"
                                        th:text="${sp.tenSanPham}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-sm btn-primary w-100">
                                <i class="fa fa-plus me-1"></i> Thêm sản phẩm
                            </button>
                        </div>
                    </div>
                </form>

                <!-- Bảng sản phẩm đã thêm -->
                <div class="table-responsive">
                    <table class="table table-sm table-bordered table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width:40px">#</th>
                                <th>Tên sản phẩm</th>
                                <th class="text-center" style="width:80px">Xóa</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pv, iter : ${phamViList}">
                                <td class="text-muted small" th:text="${iter.count}"></td>
                                <td class="fw-semibold"
                                    th:text="${pv.sanPham != null ? pv.sanPham.tenSanPham : '(Toàn bộ)'}">
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/admin/khuyen-mai/{id}/pham-vi/xoa/{pvId}(id=${ctkm.id}, pvId=${pv.id})}"
                                       class="btn btn-sm btn-outline-danger py-0 px-2"
                                       onclick="return confirm('Xóa sản phẩm này khỏi phạm vi áp dụng?')">
                                        <i class="fa fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(phamViList)}">
                                <td colspan="3" class="text-center text-muted py-4">
                                    <i class="fa fa-inbox me-1"></i>
                                    Chưa có sản phẩm nào. Hãy thêm sản phẩm áp dụng bên trên.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
