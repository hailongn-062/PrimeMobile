<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle} + ' - PrimeMobile'">KM Đơn hàng tối thiểu</title>
    <th:block th:replace="~{layout/admin-layout :: adminHead}"></th:block>
</head>
<body>
    <th:block th:replace="~{layout/admin-layout :: sidebar}"></th:block>
    <th:block th:replace="~{layout/admin-layout :: topbar}"></th:block>

    <main id="pmContent">
        <div class="pm-card" style="max-width: 700px; margin: 0 auto;">
            <div class="pm-card-header">
                <i class="fa fa-shopping-cart me-2 text-success"></i>
                <span th:text="${pageTitle}">KM Đơn hàng tối thiểu</span>
            </div>
            <div class="card-body p-4">

                <div th:if="${errorMessage}" class="alert alert-danger p-2 mb-3 small" th:text="${errorMessage}"></div>

                <div class="alert alert-success py-2 mb-4 small">
                    <i class="fa fa-info-circle me-1"></i>
                    Khuyến mãi loại này tự động áp dụng khi tổng giá trị đơn hàng của khách đạt ngưỡng tối thiểu.
                </div>

                <form th:action="@{/admin/khuyen-mai/save}" th:object="${ctkm}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" name="loai" value="don_hang_toi_thieu" />

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên chương trình <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{tenCtkm}" required
                               placeholder="VD: Giảm 5% cho đơn từ 5 triệu" />
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phần trăm giảm (%) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" class="form-control" th:field="*{giaTriUuDai}"
                                       required min="0.01" max="100" step="0.01" placeholder="VD: 5" />
                                <span class="input-group-text">%</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Đơn hàng tối thiểu (đ) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" class="form-control" th:field="*{donHangToiThieu}"
                                       required min="1" placeholder="VD: 5000000" />
                                <span class="input-group-text">đ</span>
                            </div>
                            <div class="form-text">Khách cần đặt đơn từ số tiền này trở lên mới được giảm.</div>
                        </div>
                    </div>



                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày bắt đầu <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" th:field="*{ngayBatDau}" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Ngày kết thúc <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" th:field="*{ngayKetThuc}" required />
                        </div>
                    </div>

                    <div class="mb-3" th:if="${ctkm.id != null}">
                        <label class="form-label fw-semibold">Trạng thái</label>
                        <select class="form-select" th:field="*{trangThai}">
                            <option value="chua_bat_dau">Chưa bắt đầu</option>
                            <option value="dang_dien_ra">Đang diễn ra</option>
                            <option value="tam_dung">Tạm dừng</option>
                            <option value="da_ket_thuc">Đã kết thúc</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mô tả</label>
                        <textarea class="form-control" th:field="*{moTa}" rows="2"
                                  placeholder="Mô tả ngắn về chương trình..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                        <a href="/admin/khuyen-mai" class="btn btn-light">
                            <i class="fa fa-arrow-left me-1"></i> Hủy
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fa fa-save me-1"></i> Lưu chương trình
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout/admin-layout :: adminScripts}"></th:block>
</body>
</html>
